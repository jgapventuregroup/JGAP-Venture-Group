<!doctype html><html><head><meta charset="utf-8"><title>JGAP Deal Intelligence — Test Console</title><style>body{font-family:system-ui;margin:30px;max-width:1000px}textarea{width:100%;height:280px;font-family:monospace}button{padding:10px 16px;margin:8px 0}pre{background:#f4f4f4;padding:15px;white-space:pre-wrap}.warn{padding:12px;background:#fff3cd;border:1px solid #e7c85a}</style></head><body><h1>JGAP Deal Intelligence — Test Console</h1><div class="warn"><b>TEST MODE ONLY.</b> This console does not send emails or customer alerts. It is for validating normalized listing data and the matching/import pipeline.</div><h2>Sample provider payload</h2><textarea id="payload">{"source_name":"RealEstateAPI","records":[{"id":"TEST-001","address":"100 Example St","city":"Bristol","state":"TN","zip":"37620","propertyType":"Multifamily","units":8,"listPrice":650000,"capRate":0.091,"dscr":1.31,"monthlyCashFlow":1250,"url":"https://example.com/test-001"}]}</textarea><br><button onclick="validate()">Validate payload</button><button onclick="copy()">Copy JSON</button><h2>Validation</h2><pre id="out">No validation run.</pre><script>function validate(){let out=document.getElementById('out');try{let p=JSON.parse(document.getElementById('payload').value);let rows=p.records||[];let errors=[];if(!p.source_name)errors.push('Missing source_name');if(!Array.isArray(rows))errors.push('records must be an array');rows.forEach((r,i)=>{if(!r.id&&!r.external_id&&!r.listingId&&!r.mlsNumber)errors.push('Record '+i+': missing listing identifier');if(r.units!=null&&Number(r.units)<1)errors.push('Record '+i+': invalid units');if(r.listPrice!=null&&Number(r.listPrice)<=0)errors.push('Record '+i+': invalid price');});out.textContent=errors.length?'FAILED\n'+errors.join('\n'):'PASSED\nRecords: '+rows.length+'\nOutbound email: DISABLED\nCustomer alerts: DISABLED\nMode: TEST ONLY';}catch(e){out.textContent='INVALID JSON\n'+e.message}}function copy(){navigator.clipboard.writeText(document.getElementById('payload').value)}}</script></body></html>
