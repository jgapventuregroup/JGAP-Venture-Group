<script>
(function(){
  const KEY='jgap_left_nav_order_v1';
  const DEFAULTS=["navDeals","navLeads","navMoney","navDashboard","navProperties","navVendors","navRepairs","navProjects","navLaundromat","navFinances","navDocuments","navTasks","navReports","navInvestments","navUsers"];
  const labels={
    navDeals:'Deals / Analyzer',navLeads:'🎯 Lead Generation',navMoney:'💰 Money-Making System',navDashboard:'Dashboard',navProperties:'Properties',
    navVendors:'👷 Vendors & Contractors',navRepairs:'Repairs',navProjects:'🏠 House Flips / Projects',navLaundromat:'🧺 Laundromat Division',navFinances:'Finances',
    navDocuments:'Documents',navTasks:'Tasks',navReports:'Reports',navInvestments:'Investments',navLenders:'Lenders',navUsers:'Users & Access'
  };
  function getNavOrder(){
    try{const x=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(x)&&x.length)return x.filter(id=>DEFAULTS.includes(id)).concat(DEFAULTS.filter(id=>!x.includes(id)));}catch(e){}
    return DEFAULTS.slice();
  }
  function applyNavOrder(){
    const nav=document.querySelector('.layout>nav');if(!nav)return;
    const els={}; DEFAULTS.forEach(id=>{const e=document.getElementById(id);if(e)els[id]=e;});
    getNavOrder().forEach(id=>{if(els[id])nav.appendChild(els[id]);});
  }
  function renderNavEditor(){
    const el=document.getElementById('navOrganizerList');if(!el)return;
    const a=getNavOrder();
    el.innerHTML=a.map((id,i)=>'<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px;border:1px solid #e2e7ef;border-radius:8px;margin:5px 0;background:#fff"><span>'+labels[id]+'</span><span style="display:flex;gap:4px"><button class="secondary" type="button" onclick="moveNavItem(\''+id+'\',-1)" '+(i===0?'disabled':'')+'>↑</button><button class="secondary" type="button" onclick="moveNavItem(\''+id+'\',1)" '+(i===a.length-1?'disabled':'')+'>↓</button><button class="secondary" type="button" onclick="moveNavItemTop(\''+id+'\')" '+(i===0?'disabled':'')+'>Top</button></span></div>').join('');
  }
  window.toggleNavOrganizer=function(){const el=document.getElementById('navOrganizer');if(!el)return;el.style.display=el.style.display==='none'?'block':'none';renderNavEditor();};
  async function saveNavOrderToAccount(layout){try{const {data:{user}}=await sb.auth.getUser();if(!user)return;const {data:member}=await sb.from('company_members').select('company_id').eq('user_id',user.id).limit(1).maybeSingle();if(!member)return;await sb.from('dashboard_layout_preferences').upsert({user_id:user.id,company_id:member.company_id,nav_layout:layout,updated_at:new Date().toISOString()},{onConflict:'user_id'});}catch(e){console.warn('Nav layout account save failed',e);}}
  async function loadNavOrderFromAccount(){try{const {data:{user}}=await sb.auth.getUser();if(!user)return;const {data}=await sb.from('dashboard_layout_preferences').select('nav_layout').eq('user_id',user.id).maybeSingle();if(data&&Array.isArray(data.nav_layout)&&data.nav_layout.length){const clean=data.nav_layout.filter(id=>DEFAULTS.includes(id)).concat(DEFAULTS.filter(id=>!data.nav_layout.includes(id)));localStorage.setItem(KEY,JSON.stringify(clean));applyNavOrder();renderNavEditor();}}catch(e){console.warn('Nav layout account load failed',e);}}
  window.loadNavOrderFromAccount=loadNavOrderFromAccount;
  window.moveNavItem=function(id,dir){const a=getNavOrder(),i=a.indexOf(id),j=i+dir;if(i<0||j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];localStorage.setItem(KEY,JSON.stringify(a));applyNavOrder();renderNavEditor();saveNavOrderToAccount(a);};
  window.moveNavItemTop=function(id){const a=getNavOrder(),i=a.indexOf(id);if(i<=0)return;a.splice(i,1);a.unshift(id);localStorage.setItem(KEY,JSON.stringify(a));applyNavOrder();renderNavEditor();saveNavOrderToAccount(a);};
  window.resetNavOrder=function(){localStorage.removeItem(KEY);applyNavOrder();renderNavEditor();saveNavOrderToAccount(DEFAULTS.slice());};
  window.applyNavOrder=applyNavOrder;
  document.addEventListener('DOMContentLoaded',()=>setTimeout(applyNavOrder,0));
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  const KEY='jgap_dashboard_layout_v2';
  window.dashboardSections=['kpis','quickActions','primeRate','rent','lease','collections','propertyCenter','portfolioPerformance','tasks'];
  window.dashboardLabels={kpis:'Key Metrics',quickActions:'Deals / Quick Actions',primeRate:'Prime Rate',rent:'Rent Collection',lease:'Lease Expirations & Renewals',collections:'Collections & Delinquency',propertyCenter:'Property Management Center',portfolioPerformance:'Portfolio Financial Performance',tasks:'Tasks & Action Items'};
  function getLayout(){try{const x=JSON.parse(localStorage.getItem(KEY)); if(Array.isArray(x)&&x.length) return x.filter(id=>dashboardSections.includes(id)).concat(dashboardSections.filter(id=>!x.includes(id)));}catch(e){} return dashboardSections.slice();}
  async function saveLayoutToAccount(layout){
    try{
      const {data:{user}}=await sb.auth.getUser();
      if(!user) return;
      const {data:member}=await sb.from('company_members').select('company_id').eq('user_id',user.id).limit(1).maybeSingle();
      if(!member) return;
      await sb.from('dashboard_layout_preferences').upsert({user_id:user.id,company_id:member.company_id,layout:layout,updated_at:new Date().toISOString()},{onConflict:'user_id'});
    }catch(e){console.warn('Dashboard layout account save failed',e);}
  }
  window.loadDashboardLayoutFromAccount=async function(){
    try{
      const {data:{user}}=await sb.auth.getUser();
      if(!user) return;
      const {data}=await sb.from('dashboard_layout_preferences').select('layout').eq('user_id',user.id).maybeSingle();
      if(data && Array.isArray(data.layout) && data.layout.length){
        const clean=data.layout.filter(id=>dashboardSections.includes(id)).concat(dashboardSections.filter(id=>!data.layout.includes(id)));
        localStorage.setItem(KEY,JSON.stringify(clean));
      }
    }catch(e){console.warn('Dashboard layout account load failed',e);}
  };
  window.toggleDashboardEdit=function(){const el=document.getElementById('dashboardLayoutEditor'); if(!el)return; el.style.display=el.style.display==='none'?'block':'none'; renderEditor();};
  function renderEditor(){const el=document.getElementById('dashboardLayoutEditor'); if(!el)return; const layout=getLayout(); el.innerHTML='<div class="muted" style="margin-bottom:8px">Use ↑, ↓, or Top to change the order. Your layout is saved to your account and this browser.</div>'+layout.map((id,i)=>'<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;border:1px solid #ddd;border-radius:10px;margin:6px 0;background:#fff"><span>'+dashboardLabels[id]+'</span><span style="display:flex;gap:5px;flex-wrap:wrap"><button class="secondary" onclick="moveDashboardSection(\''+id+'\',-1)" '+(i===0?'disabled':'')+'>↑</button><button class="secondary" onclick="moveDashboardSection(\''+id+'\',1)" '+(i===layout.length-1?'disabled':'')+'>↓</button><button class="secondary" onclick="moveDashboardSectionToTop(\''+id+'\')" '+(i===0?'disabled':'')+'>Top</button></span></div>').join('');}
  window.moveDashboardSection=function(id,dir){const a=getLayout(),i=a.indexOf(id),j=i+dir;if(i<0||j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];localStorage.setItem(KEY,JSON.stringify(a));applyLayout();renderEditor();saveLayoutToAccount(a);};
  window.moveDashboardSectionToTop=function(id){const a=getLayout(),i=a.indexOf(id);if(i<=0)return;a.splice(i,1);a.unshift(id);localStorage.setItem(KEY,JSON.stringify(a));applyLayout();renderEditor();saveLayoutToAccount(a);};
  window.resetDashboardLayout=function(){localStorage.removeItem(KEY);const a=dashboardSections.slice();applyLayout();renderEditor();saveLayoutToAccount(a);};
  function applyLayout(){const root=document.getElementById('dashboardContent'); if(!root)return; const map={}; [...root.children].forEach(el=>{if(el.dataset&&el.dataset.dashboardSection)map[el.dataset.dashboardSection]=el;}); const layout=getLayout(); layout.forEach(id=>{if(map[id])root.appendChild(map[id]);});}
  window.applyDashboardLayout=applyLayout;
})();
</script>

function togglePortfolioDetails(){
 const panel=document.getElementById('dashPortfolioPropertyDetails');
 const btn=document.getElementById('portfolioDetailsToggle');

 const open=panel.style.display==='none'||!panel.style.display;
 panel.style.display=open?'block':'none';

async function loadDashboardPortfolioPerformance(){
 const ids=['dashPortfolioPurchase','dashPortfolioValue','dashPortfolioEquity','dashPortfolioRent','dashPortfolioDebt','dashPortfolioFixed','dashPortfolioPropertyRows'];
 const els=ids.map(id=>document.getElementById(id));
 if(els.some(x=>!x))return;
 try{
   const {data,error}=await sb.from('properties').select('id,name,status,purchase_price,current_value,monthly_rent,mortgage_balance,monthly_mortgage_payment,monthly_hoa,annual_property_tax,annual_insurance').neq('status','sold').order('name');
   if(error)throw error;
   const rows=data||[];
   const purchase=rows.reduce((a,r)=>a+Number(r.purchase_price||0),0);
   const value=rows.reduce((a,r)=>a+Number(r.current_value||0),0);
   const debt=rows.reduce((a,r)=>a+Number(r.mortgage_balance||0),0);
   const rent=rows.reduce((a,r)=>a+Number(r.monthly_rent||0),0);
   const fixed=rows.reduce((a,r)=>a+Number(r.monthly_mortgage_payment||0)+Number(r.monthly_hoa||0)+(Number(r.annual_property_tax||0)/12)+(Number(r.annual_insurance||0)/12),0);
   const equity=value>0 ? value-debt : 0;
   const money=n=>'$'+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:0});
   document.getElementById('dashPortfolioPurchase').textContent=money(purchase);
   document.getElementById('dashPortfolioValue').textContent=value?money(value):'Not fully entered';
   document.getElementById('dashPortfolioEquity').textContent=value?money(equity):'—';
   document.getElementById('dashPortfolioRent').textContent=money(rent);
   document.getElementById('dashPortfolioDebt').textContent=money(debt);
   document.getElementById('dashPortfolioFixed').textContent=money(fixed);
   if(!rows.length){els[6].innerHTML='<div class="card"><b>No active properties yet.</b><div class="muted" style="margin-top:6px">Add a property and its financial details to see portfolio performance here.</div></div>';return;}
   els[6].innerHTML=rows.map(r=>{
     const v=Number(r.current_value||0),d=Number(r.mortgage_balance||0),eq=v?v-d:null;
     return '<div class="card" style="margin-bottom:8px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><div><b>'+escapeHtml(r.name||'Property')+'</b><div class="muted">Rent '+money(r.monthly_rent)+' / mo • Debt '+money(d)+(v?' • Value '+money(v):' • Current value not entered')+'</div></div><div><b>'+(eq===null?'Equity —':money(eq)+' equity')+'</b></div></div>';
   }).join('');
 }catch(e){els[6].innerHTML='<div class="error">Could not load portfolio financials: '+escapeHtml(e.message)+'</div>';}
}

async function loadDashboardPropertyManagementCenter(){
 const ids=['pmProperties','pmTenants','pmLeases','pmOutstanding'];

 const details=document.getElementById('propertyManagementCenterDetails');
 if(els.some(x=>!x)||!details)return;
 try{
   const results=await Promise.all([
     sb.from('properties').select('id,name,status,monthly_rent').neq('status','sold'),
     sb.from('property_tenants').select('id,property_id,name'),
     sb.from('property_leases').select('id,property_id,tenant_id,start_date,end_date,monthly_rent,status').in('status',['active','renewal']),
     sb.from('property_rent_payments').select('property_id,amount_due,amount_paid,due_date,status')
   ]);
   const [pr,tr,lr,payr]=results;

   if(firstError){

     return;
   }

   els[0].textContent=p.length; els[1].textContent=t.length; els[2].textContent=l.length; els[3].textContent=money2(outstanding);
   const today=new Date(); today.setHours(0,0,0,0);
   const ninety=new Date(today); ninety.setDate(ninety.getDate()+90);
   const expiring=l.filter(x=>x.end_date).filter(x=>{const d=new Date(x.end_date+'T00:00:00');return d>=today&&d<=ninety;});
   const todayIso=today.toISOString().slice(0,10);
   const overdue=pay.filter(x=>x.due_date<todayIso&&Number(x.amount_due||0)>Number(x.amount_paid||0));
   details.innerHTML=`<div class="stats">
     <div><span>Rental Properties</span><b>${p.length}</b></div>
     <div><span>Tenants</span><b>${t.length}</b></div>
     <div><span>Renewals / Expiring 90 Days</span><b>${expiring.length}</b></div>
     <div><span>Overdue Charges</span><b>${overdue.length}</b></div>

     <b>Quick workflow</b>
     <p class="muted" style="margin:7px 0 0">Open a property to work through its tenant, lease, rent schedule, payment ledger, collections, and renewal records. Empty sections remain visible so you can add records as the portfolio grows.</p>
   </div>`;
 }catch(err){
   console.error('Property management center exception',err);
   details.innerHTML='<div class="card"><b>Property management summary could not load.</b><p class="muted">The management workspace is still available. Open it to continue managing your properties.</p><button class="primary" onclick="renderPropertyManagementPage()">Open Property Management</button></div>';
 }
}

async function loadDashboardLeaseExpirations(){
 const host=document.getElementById("dashboardLeaseExpirations"); if(!host)return;
 const today=new Date(); const cutoff=new Date(today); cutoff.setDate(cutoff.getDate()+90);
 const iso=d=>d.toISOString().slice(0,10);
 const [{data:leases,error:le},{data:properties,error:pe},{data:tenants,error:te}]=await Promise.all([
  sb.from("property_leases").select("id,property_id,tenant_id,start_date,end_date,monthly_rent,status").not("end_date","is","null").gte("end_date",iso(today)).lte("end_date",iso(cutoff)).order("end_date"),
  sb.from("properties").select("id,name,address_line1,city,state"),
  sb.from("property_tenants").select("id,name")
 ]);
 if(le||pe||te){host.innerHTML='<span class="error">Could not load lease expiration information.</span>';return;}
 const rows=leases||[];
 if(!rows.length){host.innerHTML='<p class="muted">No leases expire in the next 90 days.</p>';return;}
 host.innerHTML=`<div style="overflow:auto"><table class="table"><thead><tr><th>Property</th><th>Tenant</th><th>Lease Ends</th><th>Monthly Rent</th><th>Status</th></tr></thead><tbody>${rows.map(l=>{const p=(properties||[]).find(x=>x.id===l.property_id);const t=(tenants||[]).find(x=>x.id===l.tenant_id);const days=Math.ceil((new Date(l.end_date)-today)/86400000);return `<tr><td><button class="secondary" onclick="renderPropertyDetail('${l.property_id}')">${escapeHtml(p?.name||p?.address_line1||"Property")}</button></td><td>${escapeHtml(t?.name||"—")}</td><td>${escapeHtml(l.end_date||"—")} <span class="pill">${days} days</span></td><td>${money2(l.monthly_rent)}</td><td><span class="pill">${escapeHtml(l.status||"active")}</span></td></tr>`}).join("")}</tbody></table></div>`;
}

async function loadDashboardDelinquency(){
 const host=document.getElementById("dashboardDelinquency"); if(!host)return;
 const today=new Date().toISOString().slice(0,10);
 const [{data:payments,error:pErr},{data:properties,error:propErr}]=await Promise.all([
  sb.from("property_rent_payments").select("property_id,due_date,amount_due,amount_paid,status").lt("due_date",today),
  sb.from("properties").select("id,name,address_line1,city,state").neq("status","sold").order("name")
 ]);
 if(pErr||propErr){host.innerHTML='<span class="error">Could not load collection details.</span>';return;}
 const overdue=(payments||[]).filter(r=>Number(r.amount_due||0)>Number(r.amount_paid||0));
 const by={}; overdue.forEach(r=>{const x=by[r.property_id]||(by[r.property_id]={amount:0,items:0});x.amount+=Math.max(0,Number(r.amount_due||0)-Number(r.amount_paid||0));x.items++;});
 const rows=(properties||[]).filter(p=>by[p.id]).sort((a,b)=>by[b.id].amount-by[a.id].amount);
 if(!rows.length){host.innerHTML='<div class="card"><b>No overdue rent found.</b><p class="muted">Past-due charges with an unpaid balance will appear here automatically.</p></div>';return;}
 host.innerHTML='<div style="overflow:auto"><table class="table"><thead><tr><th>Property</th><th>Overdue Items</th><th>Outstanding</th><th></th></tr></thead><tbody>'+rows.map(p=>`<tr><td><b>${escapeHtml(p.name||p.address_line1||"Property")}</b><div class="muted">${escapeHtml([p.address_line1,p.city,p.state].filter(Boolean).join(", "))}</div></td><td>${by[p.id].items}</td><td>${money2(by[p.id].amount)}</td><td><button class="secondary" onclick="renderPropertyDetail('${p.id}')">Open Ledger</button></td></tr>`).join('')+'</tbody></table></div>';
}

function filterPropertyManagement(){

 const leases=d.leases.filter(l=>{const p=d.props.find(x=>x.id===l.property_id),t=d.tenants.find(x=>x.id===l.tenant_id);return match(p?.name,p?.address_line1,t?.name,l.status)});

async function loadProperties() {
  const wrap = document.getElementById("propertiesList");
  if (!wrap) return;
  const { data, error } = await sb
    .from("properties")
    .select("id,name,property_type,address_line1,city,state,postal_code,purchase_price,purchase_date,current_value,monthly_rent,monthly_mortgage_payment,mortgage_balance,annual_property_tax,annual_insurance,monthly_hoa,status,sold_date,sale_price,sale_notes,insurance_provider,policy_number,lease_start_date,lease_end_date,tenant_name,tenant_phone,tenant_email,acquisition_notes")
    .order("created_at", { ascending: true });

  if (error) {
    wrap.innerHTML = '<div class="panel"><b>Could not load properties.</b><br><span class="muted">'+escapeHtml(error.message)+'</span></div>';
    return;
  }

  if (!data || !data.length) {
    wrap.innerHTML = '<div class="panel">No properties have been added yet.</div>';
    return;
  }

  wrap.innerHTML = data.map(p => {
    const money = v => v == null ? "—" : "$" + Number(v).toLocaleString("en-US", {minimumFractionDigits:0, maximumFractionDigits:0});
    const addr = [p.address_line1, p.city, p.state, p.postal_code].filter(Boolean).join(", ");
    const type = (p.property_type || "").replaceAll("_"," ");
    return `
      <div class="panel" style="cursor:pointer" onclick="renderPropertyDetail('${p.id}')">
        <div class="propertyTop">
          <div>
            <h2>${escapeHtml(p.name)}</h2>
            <div class="muted">${escapeHtml(type)} • ${escapeHtml(p.status || "active")}</div>
            <div class="muted">${escapeHtml(addr)}</div>
          </div>
          <div>
            ${p.status === "sold" ? `<span class="pill">Sold${p.sold_date ? " • " + escapeHtml(p.sold_date) : ""}</span>` : `<button class="secondary" onclick="event.stopPropagation();markPropertySoldUI('${p.id}')">Mark Sold</button>`}
          </div>
        </div>
        <div class="stats">
          <div><span>Purchase</span><b>${money(p.purchase_price)}</b></div>
          <div><span>Current value</span><b>${money(p.current_value)}</b></div>
          <div><span>Monthly rent</span><b>${money(p.monthly_rent)}</b></div>
          <div><span>Mortgage balance</span><b>${money(p.mortgage_balance)}</b></div>
          <div><span>Mortgage payment</span><b>${money(p.monthly_mortgage_payment)}</b></div>
          <div><span>Property tax / yr</span><b>${money(p.annual_property_tax)}</b></div>
          <div><span>HOA / mo</span><b>${money(p.monthly_hoa)}</b></div>
          <div><span>Insurance / yr</span><b>${money(p.annual_insurance)}</b></div>
        </div>
      </div>`;
  }).join("");
}

async function loadPropertyRentCollection(propertyId){

async function exportTenantLedger(propertyId){

 const blob=new Blob([lines],{type:"text/csv;charset=utf-8"}); const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download="jgap-rent-ledger.csv"; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);

async function addPropertyFinancialEntry(propertyId, transactionType){
  const label=transactionType==='expense'?'Expense':'Income';
  const date=prompt(label+' date (YYYY-MM-DD):',new Date().toISOString().slice(0,10)); if(date===null)return;
  const category=prompt(label+' category:',transactionType==='expense'?'Repairs':'Other Income'); if(category===null||!category.trim())return;
  const description=prompt(label+' description:', ''); if(description===null)return;
  const amount=prompt(label+' amount:',''); if(amount===null||Number(amount)<0||amount===''){alert('Enter a valid amount.');return;}
  const {error}=await sb.rpc('create_current_user_transaction',{p_property_id:propertyId,p_transaction_date:date,p_category:category.trim(),p_description:description.trim()||null,p_amount:Number(amount),p_transaction_type:transactionType});
  if(error){alert(error.message);return;}
  renderPropertyDetail(propertyId);
}

async function editPropertyTransaction(x){
  const date=prompt("Transaction date (YYYY-MM-DD):",x.transaction_date||""); if(date===null)return;
  const category=prompt("Category:",x.category||""); if(category===null)return;
  const description=prompt("Description:",x.description||""); if(description===null)return;
  const amount=prompt("Amount:",x.amount??""); if(amount===null)return;
  const type=prompt("Type (income or expense):",x.transaction_type||"expense"); if(type===null)return;
  const n=Number(amount); if(!Number.isFinite(n)||n<0){alert("Enter a valid non-negative amount.");return;}
  const {error}=await sb.rpc("update_current_user_transaction",{p_transaction_id:x.id,p_transaction_date:date,p_category:category,p_description:description,p_amount:n,p_transaction_type:type});
  if(error){alert(error.message);return;}
  alert("Transaction updated."); await loadPropertyFinancialSnapshot(x.property_id);
}

async function loadPropertyFinancialSnapshot(propertyId){
  const host=document.getElementById("propertyFinancialSnapshot"); if(!host)return;
  const [{data:tx,error:txErr},{data:rent,error:rentErr},{data:p,error:pErr}]=await Promise.all([
    sb.from("financial_transactions").select("transaction_date,category,description,amount,transaction_type").eq("property_id",propertyId).order("transaction_date",{ascending:false}),
    sb.from("property_rent_payments").select("due_date,amount_due,amount_paid,status").eq("property_id",propertyId).order("due_date",{ascending:false}),
    sb.from("properties").select("monthly_rent,monthly_mortgage_payment,annual_property_tax,annual_insurance,monthly_hoa").eq("id",propertyId).single()
  ]);
  if(txErr||rentErr||pErr){host.innerHTML='<div class="card"><b>Financial snapshot could not load.</b><p class="muted">'+escapeHtml((txErr||rentErr||pErr)?.message||"Please try again.")+'</p></div>';return;}
  const income=(rent||[]).reduce((a,r)=>a+Number(r.amount_paid||0),0);
  const expenses=(tx||[]).filter(x=>String(x.transaction_type||'').toLowerCase()==='expense').reduce((a,x)=>a+Number(x.amount||0),0);
  const otherIncome=(tx||[]).filter(x=>String(x.transaction_type||'').toLowerCase()==='income').reduce((a,x)=>a+Number(x.amount||0),0);
  const net=income+otherIncome-expenses;
  const scheduled=(rent||[]).reduce((a,r)=>a+Number(r.amount_due||0),0);
  const outstanding=Math.max(0,scheduled-income);
  const monthlyFixed=Number(p?.monthly_mortgage_payment||0)+Number(p?.monthly_hoa||0)+Number(p?.annual_property_tax||0)/12+Number(p?.annual_insurance||0)/12;
  host.innerHTML=`<div class="stats"><div><span>Rent collected</span><b>${money2(income)}</b></div><div><span>Other income</span><b>${money2(otherIncome)}</b></div><div><span>Recorded expenses</span><b>${money2(expenses)}</b></div><div><span>Net recorded cash flow</span><b>${money2(net)}</b></div><div><span>Rent outstanding</span><b>${money2(outstanding)}</b></div><div><span>Known monthly fixed costs</span><b>${money2(monthlyFixed)}</b></div></div><div style="margin-top:14px"><button class="primary" onclick="addPropertyFinancialEntry('${propertyId}','expense')">+ Add Expense</button> <button class="secondary" onclick="addPropertyFinancialEntry('${propertyId}','income')">+ Add Income</button> <button class="secondary" onclick="renderFinancesPage()">Open Business Finances</button></div><p class="muted" style="margin-top:10px">Known fixed costs include mortgage, HOA, property tax, and insurance when those fields are entered. This snapshot does not invent missing operating expenses.</p><div style="margin-top:18px"><div class="sectionTitle">Recent Property Transactions</div>${tx&&tx.length?`<div class="tableWrap"><table><thead><tr><th>Date</th><th>Type</th><th>Category</th><th>Description</th><th>Amount</th><th></th></tr></thead><tbody>${tx.slice(0,10).map(x=>`<tr><td>${x.transaction_date||"—"}</td><td>${escapeHtml(x.transaction_type||"")}</td><td>${escapeHtml(x.category||"")}</td><td>${escapeHtml(x.description||"")}</td><td>${money2(x.amount)}</td><td><button class="secondary" onclick='editPropertyTransaction(${JSON.stringify(x)})'>Edit</button></td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">No property income or expenses have been recorded yet. Use the buttons above to add the first transaction.</div>`}</div>`;
}

async function saveProperty(id) {
  const msg = document.getElementById("editMsg");
  const val = id => document.getElementById(id).value.trim();
  const num = id => val(id) === "" ? null : Number(val(id));
  const updates = {
    name:val("e_name"), status:val("e_status"), address_line1:val("e_address"), city:val("e_city"), state:val("e_state"), postal_code:val("e_zip"),
    purchase_price:num("e_purchase"), current_value:num("e_value"), mortgage_balance:num("e_balance"), monthly_rent:num("e_rent"), monthly_mortgage_payment:num("e_payment"),
    annual_property_tax:num("e_tax"), annual_insurance:num("e_insurance"), monthly_hoa:num("e_hoa")
  };
  const {error} = await sb.from("properties").update(updates).eq("id",id);
  if(error){msg.innerHTML='<span class="error">'+escapeHtml(error.message)+'</span>';return;}
  msg.innerHTML='<span class="success">Property saved.</span>';
  setTimeout(()=>renderPropertyDetail(id),400);
}

function calcDeal(){
 if(!document.getElementById("d_price"))return;
 const price=n("d_price"), down=n("d_down"), rate=n("d_rate")/100, term=Math.max(1,n("d_term")), close=n("d_close"), rehab=n("d_rehab"), rent=n("d_rent"), vacancy=Math.min(.99,Math.max(0,n("d_vacancy")/100)), exp=n("d_exp"), other=n("d_other"), structure=document.getElementById("d_loan_structure")?.value||"amortizing";
 const loan=structure==="none"?0:Math.max(0,price-down), mr=rate/12, months=term*12;

 const cap=price?anoi/price:0, coc=cash?(cf*12/cash):0, dscr=debt?noi/debt:0, be=rent?Math.min(999,(debt+exp-other)/rent):0;
 const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v};
 set("r_loan",money2(loan));set("r_debt",money2(debt));set("r_income",money2(income));set("r_noi",money2(noi));set("r_anoi",money2(anoi));set("r_cf",money2(cf));set("r_cap",(cap*100).toFixed(2)+"%");set("r_coc",(coc*100).toFixed(2)+"%");set("r_dscr",dscr.toFixed(2));set("r_be",(be*100).toFixed(1)+"%");set("r_cash",money2(cash));
 const tc=n("d_target_coc")/100,tp=n("d_target_cap")/100,tdVal=document.getElementById("d_target_dscr")?.value,td=tdVal===""?null:Number(tdVal);
 const meets=coc>=tc&&cap>=tp&&(td===null||dscr>=td);
 set("r_target",meets?"Meets all entered targets":"Below one or more entered targets");
 const st=document.getElementById("dealStatus"); if(st)st.innerHTML=`<b>${meets?"Entered targets met":"Below one or more entered targets"}</b><p class="muted">Cap rate ${(cap*100).toFixed(2)}% vs ${(tp*100).toFixed(1)}% • Cash-on-cash ${(coc*100).toFixed(2)}% vs ${(tc*100).toFixed(1)}%${td===null?" • DSCR not required for this analysis":" • DSCR "+dscr.toFixed(2)+" vs "+td.toFixed(2)}. These are calculations from your inputs, not an investment recommendation.</p>`;
 // Maximum purchase prices use the current fixed down payment, closing costs and rehab assumptions.
 const solve=(condition)=>{let lo=0,hi=Math.max(price*4,1000000);for(let i=0;i<70;i++){const mid=(lo+hi)/2;const d=paymentFor(Math.max(0,mid-down));const val=condition(mid,d);if(val){lo=mid}else{hi=mid}}return lo};
 const maxCapRaw=tp>0?anoi/tp:0;

 const maxCoc=maxCocRaw>0?maxCocRaw:null;
 const maxDscr=maxDscrRaw>0?maxDscrRaw:null;
 const targetPriceText=(v)=>v===null?"No positive price":money2(v);
 set("r_max_cap",targetPriceText(maxCap));set("r_max_coc",targetPriceText(maxCoc));set("r_max_dscr",td!==null&&td>0?targetPriceText(maxDscr):"—");

async function saveTransaction(){
 const msg=document.getElementById("financeMsg");

 const transactionType=document.getElementById("f_type")?.value||"expense";
 const propertyId=document.getElementById("f_property")?.value||null;

 const description=document.getElementById("f_desc")?.value.trim()||null;
 const amount=Number(document.getElementById("f_amount")?.value)||0;
 if(amount<=0){msg.innerHTML='<div class="error">Enter an amount greater than 0.</div>';return;}
 const {error}=await sb.rpc("create_current_user_transaction",{p_property_id:propertyId,p_transaction_date:date,p_category:category,p_description:description,p_amount:amount,p_transaction_type:transactionType});
 if(error){msg.innerHTML='<div class="error">'+escapeHtml(error.message)+'</div>';return;}
 msg.innerHTML='<div class="success">Transaction saved.</div>';
 document.getElementById("f_amount").value="0";
 document.getElementById("f_desc").value="";

async function loadTransactions(){
 const wrap=document.getElementById("transactionsList"); if(!wrap)return;
 const month=document.getElementById("financeMonth")?.value||new Date().toISOString().slice(0,7);
 const propertyId=document.getElementById("financePropertyFilter")?.value||"";
 let q=sb.from("financial_transactions").select("id,transaction_date,category,description,amount,transaction_type,property_id,properties(name)").gte("transaction_date",month+"-01").lt("transaction_date",nextMonthString(month)).order("transaction_date",{ascending:false});
 if(propertyId)q=q.eq("property_id",propertyId);
 const {data,error}=await q;
 if(error){wrap.innerHTML='<b>Could not load transactions.</b><br>'+escapeHtml(error.message);return;}
 const rows=data||[];
 const income=rows.filter(x=>x.transaction_type==="income").reduce((a,x)=>a+Number(x.amount||0),0);
 const expenses=rows.filter(x=>x.transaction_type==="expense").reduce((a,x)=>a+Number(x.amount||0),0);
 const net=income-expenses;
 const cards=document.querySelectorAll("#financeStats .card .metric"); if(cards.length){cards[0].textContent=money2(income);cards[1].textContent=money2(expenses);cards[2].textContent=money2(net);cards[3].textContent=String(rows.length);}
 const note=document.getElementById("financeNetNote"); if(note)note.textContent=net>=0?"Positive recorded cash flow":"Negative recorded cash flow";
 const categories={}; rows.forEach(x=>{const k=x.category||"Other";categories[k]=(categories[k]||0)+(x.transaction_type==="expense"?-1:1)*Number(x.amount||0);});
 const breakdown=Object.entries(categories).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]));
 const bd=document.getElementById("financeBreakdown"); if(bd){bd.innerHTML=breakdown.length?`<div class="sectionTitle">Category Breakdown</div><div style="overflow:auto"><table class="table"><thead><tr><th>Category</th><th>Net</th><th>Direction</th></tr></thead><tbody>${breakdown.map(([k,v])=>`<tr><td>${escapeHtml(k)}</td><td>${money2(Math.abs(v))}</td><td>${v>=0?"Income":"Expense"}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">No transactions recorded for ${escapeHtml(month)} yet. Add the first transaction below.</div>`;}
 if(!rows.length){wrap.innerHTML='<div class="sectionTitle">Transaction History</div><p class="muted">No transactions recorded for the selected month/filter.</p>';return;}
 wrap.innerHTML='<div class="sectionTitle">Transaction History</div><div style="overflow:auto"><table class="table"><thead><tr><th>Date</th><th>Property</th><th>Category</th><th>Description</th><th>Type</th><th>Amount</th></tr></thead><tbody>'+rows.map(x=>`<tr><td>${x.transaction_date||"—"}</td><td>${escapeHtml(x.properties?.name||"Company / General")}</td><td>${escapeHtml(x.category||"")}</td><td>${escapeHtml(x.description||"")}</td><td>${escapeHtml(x.transaction_type)}</td><td>${money2(x.amount)}</td></tr>`).join("")+'</tbody></table></div>';
}
function nextMonthString(month){const [y,m]=month.split("-").map(Number);const d=new Date(Date.UTC(y,m,1));return d.toISOString().slice(0,10);}

function projectMoney(v){return "$"+Number(v||0).toLocaleString("en-US",{minimumFractionDigits:0,maximumFractionDigits:0});}
async function loadProjects(){
 const wrap=document.getElementById("projectsList"); if(!wrap)return;
 const {data,error}=await sb.from("projects").select("*").order("created_at",{ascending:false});
 if(error){wrap.innerHTML='<b>Could not load projects.</b><br>'+escapeHtml(error.message);return;}
 if(!data?.length){wrap.innerHTML='<div class="sectionTitle">Flip Projects</div><p class="muted">No projects yet. Create your first flip above.</p>';return;}
 const enriched=[];
 for(const x of data){
   const [costsRes, matsRes]=await Promise.all([
     sb.from('project_costs').select('budget,actual_cost').eq('project_id',x.id),
     sb.from('project_materials').select('total_cost').eq('project_id',x.id)
   ]);
   const costs=costsRes.data||[], mats=matsRes.data||[];
   const rehabActual=costs.reduce((s,c)=>s+Number(c.actual_cost||0),0);
   const materialActual=mats.reduce((s,m)=>s+Number(m.total_cost||0),0);
   const projected=Number(x.purchase_price||0)+Number(x.closing_costs||0)+Number(x.rehab_budget||0)+Number(x.holding_cost_budget||0)+Number(x.financing_cost_budget||0);
   const actual=Number(x.purchase_price||0)+Number(x.closing_costs||0)+rehabActual+materialActual+Number(x.actual_holding_cost||0)+Number(x.actual_financing_cost||0);
   const projectedGross=Number(x.expected_sale_price||0)-projected;
   const actualGross=x.actual_sale_price==null?null:Number(x.actual_sale_price||0)-actual;
   enriched.push({x,rehabActual,materialActual,projected,actual,projectedGross,actualGross});
 }
 wrap.innerHTML='<div class="sectionTitle">Flip Projects</div>'+enriched.map(({x,rehabActual,materialActual,projected,actual,projectedGross,actualGross})=>`<div class="card" style="margin:12px 0"><div class="sectionTitle"><span>${escapeHtml(x.name)}</span><span class="muted">${escapeHtml(x.status)}</span></div><div class="grid"><div><div class="muted">Projected investment</div><div class="metric">${projectMoney(projected)}</div></div><div><div class="muted">Expected sale</div><div class="metric">${projectMoney(x.expected_sale_price)}</div></div><div><div class="muted">Projected gross profit</div><div class="metric">${projectMoney(projectedGross)}</div></div><div><div class="muted">Rehab actual</div><div class="metric">${projectMoney(rehabActual)}</div></div><div><div class="muted">Materials actual</div><div class="metric">${projectMoney(materialActual)}</div></div><div><div class="muted">Actual investment</div><div class="metric">${projectMoney(actual)}</div></div><div><div class="muted">Actual gross profit</div><div class="metric">${actualGross===null?'—':projectMoney(actualGross)}</div></div><div><div class="muted">Budget variance</div><div class="metric">${projectMoney(projected-actual)}</div></div></div><div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="secondary" onclick="toggleProjectCosts('${x.id}')">Manage Rehab & Costs</button><button class="secondary" onclick="toggleProjectResults('${x.id}')">Actual Results</button><button class="secondary" onclick="toggleProjectMaterials('${x.id}')">🧱 Materials</button><button class="secondary" onclick="toggleProjectTasks('${x.id}')">📋 Tasks & Timeline</button><button class="secondary" onclick="toggleProjectDueDiligence('${x.id}')">🔎 Due Diligence</button></div><div id="costs_${x.id}" style="display:none;margin-top:12px"></div><div id="results_${x.id}" style="display:none;margin-top:12px"></div><div id="materials_${x.id}" style="display:none;margin-top:12px"></div><div id="tasks_${x.id}" style="display:none;margin-top:12px"></div><div id="dd_${x.id}" style="display:none;margin-top:12px"></div></div>`).join('');
}

async function loadDashboardPrimeRate(forceRefresh=false){
 const rateEl=document.getElementById("dashPrimeRate"),dateEl=document.getElementById("dashPrimeDate"),prevEl=document.getElementById("dashPrimePrevious"),changeEl=document.getElementById("dashPrimeChange"),histEl=document.getElementById("dashPrimeHistory"),sourceEl=document.getElementById("dashPrimeSource");
 if(!rateEl)return;
 try{
   rateEl.textContent="Loading…";
   sourceEl.textContent="Checking the latest official Federal Reserve data…";
   const cacheBust=forceRefresh?"?t="+Date.now():"?t="+Date.now();
   const response=await fetch(SUPABASE_URL+"/functions/v1/prime-rate"+cacheBust,{method:"GET",cache:"no-store",credentials:"omit"});
   const data=await response.json().catch(()=>({}));
   if(!response.ok)throw new Error(data?.error||("Prime-rate service returned HTTP "+response.status));
   const latest=data?.latest, hist=(data?.history||[]);
   if(!latest)throw new Error("No current prime-rate observation was returned.");
   const prev=data?.previous || (hist.length>1?hist[hist.length-2]:null);
   rateEl.textContent=Number(latest.rate).toFixed(2)+"%";
   dateEl.textContent=latest.date;
   prevEl.textContent=prev?Number(prev.rate).toFixed(2)+"%":"—";
   const delta=data?.change!=null?Number(data.change):(prev?Number(latest.rate)-Number(prev.rate):0);
   changeEl.textContent=prev?(delta>0?"+":"")+delta.toFixed(2)+"%":"—";
   const fetched=data?.fetched_at?new Date(data.fetched_at):null;
   sourceEl.textContent="Source: Board of Governors of the Federal Reserve System via FRED · Latest official observation: "+latest.date+(fetched?" · Data checked: "+fetched.toLocaleString():"");
   const recent=hist.slice(-10).reverse();
   histEl.innerHTML='<div class="card"><b>Recent daily history</b><div style="margin-top:10px">'+recent.map((x,i)=>'<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #eee"><span>'+escapeHtml(x.date)+(i===0?' <strong>(Latest)</strong>':'')+'</span><b>'+Number(x.rate).toFixed(2)+'%</b></div>').join('')+'</div></div>';
 }catch(e){rateEl.textContent="—";dateEl.textContent="—";prevEl.textContent="—";changeEl.textContent="—";sourceEl.textContent="Unable to retrieve the latest Federal Reserve data. Please try Refresh Rate again.";histEl.innerHTML='<div class="card"><b>Prime rate unavailable</b><p class="muted">'+escapeHtml(e.message||"Unable to load Federal Reserve data.")+'</p><button class="secondary" onclick="loadDashboardPrimeRate(true)">Try Again</button></div>';}
}

<script>
// JGAP in-app browser history: keep browser Back inside the app and keep
// the address bar on the actual app URL. Navigation creates real app history entries.
(function(){
  const APP_URL = window.location.href;
  window.__JGAP_APP_URL = APP_URL;
  const navNames = [
    'renderDealsPage','renderDocumentsPage','renderPropertiesPage','renderPropertyDetail',
    'renderPropertyManagementPage','renderRepairsPage','renderFinancesPage',
    'renderProjectsPage','renderReportsPage','renderInvestmentsPage',
    'renderDealAnalyzer','renderContractorsPage','renderRehabPage','renderRentRoll'
  ];
  const originals = {};
  navNames.forEach(name => {
    if (typeof window[name] === 'function') originals[name] = window[name];
  });
  if (typeof window.render === 'function') originals.render = window.render;

  function sameState(a,b){
    if(!a || !b || a.jgap !== true || b.jgap !== true) return false;
    return a.route===b.route && JSON.stringify(a.args||[])===JSON.stringify(b.args||[]);
  }
  function pushRoute(route,args){
    if(window.__jgapHistoryHandling) return;
    const next={jgap:true,route,args:Array.isArray(args)?args:[]};
    if(sameState(history.state,next)) return;
    history.pushState(next,'',APP_URL);
  }

  const rootState={jgap:true,route:'dashboard',args:[]};
  if(!history.state || history.state.jgap!==true){
    history.replaceState(rootState,'',APP_URL);
  } else if(!history.state.route){
    history.replaceState(rootState,'',APP_URL);
  }

  // render() is also used for refreshes/auth updates, so it must never create
  // a fake Dashboard history entry. Only explicit navigation does that.
  navNames.forEach(name=>{
    if(!originals[name]) return;
    window[name]=function(){
      const args=[...arguments];
      pushRoute(name,args);
      return originals[name].apply(this,args);
    };
  });

  window.addEventListener('popstate', function(e){
    const st=e.state;
    if(!st || st.jgap!==true){
      // Restore the app URL instead of allowing Back to leave the app.
      history.pushState(rootState,'',APP_URL);
      window.__jgapHistoryHandling=true;
      try{ originals.render && originals.render(); } finally { window.__jgapHistoryHandling=false; }
      return;
    }
    const fn = st.route==='dashboard' ? originals.render : originals[st.route];
    if(!fn) return;
    window.__jgapHistoryHandling=true;
    try{ fn.apply(window,st.args||[]); } finally { window.__jgapHistoryHandling=false; }
  });
})();
</script>
