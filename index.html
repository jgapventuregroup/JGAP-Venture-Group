<script>
(function(){
  const KEY='jgap_dashboard_layout_v2';
  window.dashboardSections=['kpis','quickActions','primeRate','rent','lease','collections','propertyCenter','portfolioPerformance','tasks'];
  window.dashboardLabels={kpis:'Key Metrics',quickActions:'Deals / Quick Actions',primeRate:'Prime Rate',rent:'Rent Collection',lease:'Lease Expirations & Renewals',collections:'Collections & Delinquency',propertyCenter:'Property Management Center',portfolioPerformance:'Portfolio Financial Performance',tasks:'Tasks & Action Items'};
  function getLayout(){try{const x=JSON.parse(localStorage.getItem(KEY)); if(Array.isArray(x)&&x.length) return x.filter(id=>dashboardSections.includes(id)).concat(dashboardSections.filter(id=>!x.includes(id)));}catch(e){} return dashboardSections.slice();}
  async function saveLayoutToAccount(layout){
    try{
      const {data:{user}}=await sb.auth.getUser();
      if(!user) return;
      const {data:member}=await sb.from('company_members').select('company_id').eq('user_id',user.id).limit(1).maybeSingle();
      if(!member) return;
      await sb.from('dashboard_layout_preferences').upsert({user_id:user.id,company_id:member.company_id,layout:layout,updated_at:new Date().toISOString()},{onConflict:'user_id'});
    }catch(e){console.warn('Dashboard layout account save failed',e);}
  }
  window.loadDashboardLayoutFromAccount=async function(){
    try{
      const {data:{user}}=await sb.auth.getUser();
      if(!user) return;
      const {data}=await sb.from('dashboard_layout_preferences').select('layout').eq('user_id',user.id).maybeSingle();
      if(data && Array.isArray(data.layout) && data.layout.length){
        const clean=data.layout.filter(id=>dashboardSections.includes(id)).concat(dashboardSections.filter(id=>!data.layout.includes(id)));
        localStorage.setItem(KEY,JSON.stringify(clean));
      }
    }catch(e){console.warn('Dashboard layout account load failed',e);}
  };
  window.toggleDashboardEdit=function(){const el=document.getElementById('dashboardLayoutEditor'); if(!el)return; el.style.display=el.style.display==='none'?'block':'none'; renderEditor();};
  function renderEditor(){const el=document.getElementById('dashboardLayoutEditor'); if(!el)return; const layout=getLayout(); el.innerHTML='<div class="muted" style="margin-bottom:8px">Use ↑, ↓, or Top to change the order. Your layout is saved to your account and this browser.</div>'+layout.map((id,i)=>'<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;border:1px solid #ddd;border-radius:10px;margin:6px 0;background:#fff"><span>'+dashboardLabels[id]+'</span><span style="display:flex;gap:5px;flex-wrap:wrap"><button class="secondary" onclick="moveDashboardSection(\''+id+'\',-1)" '+(i===0?'disabled':'')+'>↑</button><button class="secondary" onclick="moveDashboardSection(\''+id+'\',1)" '+(i===layout.length-1?'disabled':'')+'>↓</button><button class="secondary" onclick="moveDashboardSectionToTop(\''+id+'\')" '+(i===0?'disabled':'')+'>Top</button></span></div>').join('');}
  window.moveDashboardSection=function(id,dir){const a=getLayout(),i=a.indexOf(id),j=i+dir;if(i<0||j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];localStorage.setItem(KEY,JSON.stringify(a));applyLayout();renderEditor();saveLayoutToAccount(a);};
  window.moveDashboardSectionToTop=function(id){const a=getLayout(),i=a.indexOf(id);if(i<=0)return;a.splice(i,1);a.unshift(id);localStorage.setItem(KEY,JSON.stringify(a));applyLayout();renderEditor();saveLayoutToAccount(a);};
  window.resetDashboardLayout=function(){localStorage.removeItem(KEY);const a=dashboardSections.slice();applyLayout();renderEditor();saveLayoutToAccount(a);};
  function applyLayout(){const root=document.getElementById('dashboardContent'); if(!root)return; const map={}; [...root.children].forEach(el=>{if(el.dataset&&el.dataset.dashboardSection)map[el.dataset.dashboardSection]=el;}); const layout=getLayout(); layout.forEach(id=>{if(map[id])root.appendChild(map[id]);});}
  window.applyDashboardLayout=applyLayout;
})();
</script>

function togglePortfolioDetails(){
 const panel=document.getElementById('dashPortfolioPropertyDetails');
 const btn=document.getElementById('portfolioDetailsToggle');
 if(!panel||!btn)return;
 const open=panel.style.display==='none'||!panel.style.display;
 panel.style.display=open?'block':'none';
 btn.textContent=open?'▾ Hide Property Details':'▸ View Property Details';
}

async function loadDashboardPortfolioPerformance(){
 const ids=['dashPortfolioPurchase','dashPortfolioValue','dashPortfolioEquity','dashPortfolioRent','dashPortfolioDebt','dashPortfolioFixed','dashPortfolioPropertyRows'];
 const els=ids.map(id=>document.getElementById(id));
 if(els.some(x=>!x))return;
 try{
   const {data,error}=await sb.from('properties').select('id,name,status,purchase_price,current_value,monthly_rent,mortgage_balance,monthly_mortgage_payment,monthly_hoa,annual_property_tax,annual_insurance').neq('status','sold').order('name');
   if(error)throw error;
   const rows=data||[];
   const purchase=rows.reduce((a,r)=>a+Number(r.purchase_price||0),0);
   const value=rows.reduce((a,r)=>a+Number(r.current_value||0),0);
   const debt=rows.reduce((a,r)=>a+Number(r.mortgage_balance||0),0);
   const rent=rows.reduce((a,r)=>a+Number(r.monthly_rent||0),0);
   const fixed=rows.reduce((a,r)=>a+Number(r.monthly_mortgage_payment||0)+Number(r.monthly_hoa||0)+(Number(r.annual_property_tax||0)/12)+(Number(r.annual_insurance||0)/12),0);
   const equity=value>0 ? value-debt : 0;
   const money=n=>'$'+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:0});
   document.getElementById('dashPortfolioPurchase').textContent=money(purchase);
   document.getElementById('dashPortfolioValue').textContent=value?money(value):'Not fully entered';
   document.getElementById('dashPortfolioEquity').textContent=value?money(equity):'—';
   document.getElementById('dashPortfolioRent').textContent=money(rent);
   document.getElementById('dashPortfolioDebt').textContent=money(debt);
   document.getElementById('dashPortfolioFixed').textContent=money(fixed);
   if(!rows.length){els[6].innerHTML='<div class="card"><b>No active properties yet.</b><div class="muted" style="margin-top:6px">Add a property and its financial details to see portfolio performance here.</div></div>';return;}
   els[6].innerHTML=rows.map(r=>{
     const v=Number(r.current_value||0),d=Number(r.mortgage_balance||0),eq=v?v-d:null;

          </div>

          <div><span>Purchase</span><b>${money(p.purchase_price)}</b></div>
          <div><span>Current value</span><b>${money(p.current_value)}</b></div>

async function addPropertyFinancialEntry(propertyId, transactionType){
  const label=transactionType==='expense'?'Expense':'Income';
  const date=prompt(label+' date (YYYY-MM-DD):',new Date().toISOString().slice(0,10)); if(date===null)return;
  const category=prompt(label+' category:',transactionType==='expense'?'Repairs':'Other Income'); if(category===null||!category.trim())return;
  const description=prompt(label+' description:', ''); if(description===null)return;
  const amount=prompt(label+' amount:',''); if(amount===null||Number(amount)<0||amount===''){alert('Enter a valid amount.');return;}
  const {error}=await sb.rpc('create_current_user_transaction',{p_property_id:propertyId,p_transaction_date:date,p_category:category.trim(),p_description:description.trim()||null,p_amount:Number(amount),p_transaction_type:transactionType});
  if(error){alert(error.message);return;}
  renderPropertyDetail(propertyId);
}

async function editPropertyTransaction(x){
  const date=prompt("Transaction date (YYYY-MM-DD):",x.transaction_date||""); if(date===null)return;
  const category=prompt("Category:",x.category||""); if(category===null)return;
  const description=prompt("Description:",x.description||""); if(description===null)return;
  const amount=prompt("Amount:",x.amount??""); if(amount===null)return;
  const type=prompt("Type (income or expense):",x.transaction_type||"expense"); if(type===null)return;
  const n=Number(amount); if(!Number.isFinite(n)||n<0){alert("Enter a valid non-negative amount.");return;}
  const {error}=await sb.rpc("update_current_user_transaction",{p_transaction_id:x.id,p_transaction_date:date,p_category:category,p_description:description,p_amount:n,p_transaction_type:type});
  if(error){alert(error.message);return;}
  alert("Transaction updated."); await loadPropertyFinancialSnapshot(x.property_id);
}

async function loadPropertyFinancialSnapshot(propertyId){
  const host=document.getElementById("propertyFinancialSnapshot"); if(!host)return;
  const [{data:tx,error:txErr},{data:rent,error:rentErr},{data:p,error:pErr}]=await Promise.all([
    sb.from("financial_transactions").select("transaction_date,category,description,amount,transaction_type").eq("property_id",propertyId).order("transaction_date",{ascending:false}),
    sb.from("property_rent_payments").select("due_date,amount_due,amount_paid,status").eq("property_id",propertyId).order("due_date",{ascending:false}),
    sb.from("properties").select("monthly_rent,monthly_mortgage_payment,annual_property_tax,annual_insurance,monthly_hoa").eq("id",propertyId).single()
  ]);
  if(txErr||rentErr||pErr){host.innerHTML='<div class="card"><b>Financial snapshot could not load.</b><p class="muted">'+escapeHtml((txErr||rentErr||pErr)?.message||"Please try again.")+'</p></div>';return;}
  const income=(rent||[]).reduce((a,r)=>a+Number(r.amount_paid||0),0);
  const expenses=(tx||[]).filter(x=>String(x.transaction_type||'').toLowerCase()==='expense').reduce((a,x)=>a+Number(x.amount||0),0);
  const otherIncome=(tx||[]).filter(x=>String(x.transaction_type||'').toLowerCase()==='income').reduce((a,x)=>a+Number(x.amount||0),0);
  const net=income+otherIncome-expenses;
  const scheduled=(rent||[]).reduce((a,r)=>a+Number(r.amount_due||0),0);
  const outstanding=Math.max(0,scheduled-income);
  const monthlyFixed=Number(p?.monthly_mortgage_payment||0)+Number(p?.monthly_hoa||0)+Number(p?.annual_property_tax||0)/12+Number(p?.annual_insurance||0)/12;
  host.innerHTML=`<div class="stats"><div><span>Rent collected</span><b>${money2(income)}</b></div><div><span>Other income</span><b>${money2(otherIncome)}</b></div><div><span>Recorded expenses</span><b>${money2(expenses)}</b></div><div><span>Net recorded cash flow</span><b>${money2(net)}</b></div><div><span>Rent outstanding</span><b>${money2(outstanding)}</b></div><div><span>Known monthly fixed costs</span><b>${money2(monthlyFixed)}</b></div></div><div style="margin-top:14px"><button class="primary" onclick="addPropertyFinancialEntry('${propertyId}','expense')">+ Add Expense</button> <button class="secondary" onclick="addPropertyFinancialEntry('${propertyId}','income')">+ Add Income</button> <button class="secondary" onclick="renderFinancesPage()">Open Business Finances</button></div><p class="muted" style="margin-top:10px">Known fixed costs include mortgage, HOA, property tax, and insurance when those fields are entered. This snapshot does not invent missing operating expenses.</p><div style="margin-top:18px"><div class="sectionTitle">Recent Property Transactions</div>${tx&&tx.length?`<div class="tableWrap"><table><thead><tr><th>Date</th><th>Type</th><th>Category</th><th>Description</th><th>Amount</th><th></th></tr></thead><tbody>${tx.slice(0,10).map(x=>`<tr><td>${x.transaction_date||"—"}</td><td>${escapeHtml(x.transaction_type||"")}</td><td>${escapeHtml(x.category||"")}</td><td>${escapeHtml(x.description||"")}</td><td>${money2(x.amount)}</td><td><button class="secondary" onclick='editPropertyTransaction(${JSON.stringify(x)})'>Edit</button></td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">No property income or expenses have been recorded yet. Use the buttons above to add the first transaction.</div>`}</div>`;
}

function updateOnboardingChecklist(p){
  const set=(id,ok,label)=>{const e=document.getElementById(id);if(!e)return;e.textContent=ok?'✓ '+label:label;e.className='pill'+(ok?' success':'');};
  set('onboardInsuranceStatus',!!(p.insurance_provider||p.policy_number),'Insurance');
  set('onboardTenantStatus',!!(p.tenant_name||p.lease_start_date||p.lease_end_date),'Tenant / Lease');
  set('onboardNotesStatus',!!p.acquisition_notes,'Acquisition Notes');
}

async function savePropertyOnboarding(id){
  const msg=document.getElementById("onboardMsg");
  const v=x=>{const e=document.getElementById(x);return e?e.value.trim():""};
  const {error}=await sb.rpc("update_current_user_property_onboarding",{
    p_property_id:id,
    p_annual_insurance:document.getElementById("e_insurance")?.value===""?null:Number(document.getElementById("e_insurance")?.value),
    p_monthly_hoa:document.getElementById("e_hoa")?.value===""?null:Number(document.getElementById("e_hoa")?.value),
    p_annual_property_tax:document.getElementById("e_tax")?.value===""?null:Number(document.getElementById("e_tax")?.value),
    p_monthly_mortgage_payment:document.getElementById("e_payment")?.value===""?null:Number(document.getElementById("e_payment")?.value),
    p_mortgage_balance:document.getElementById("e_balance")?.value===""?null:Number(document.getElementById("e_balance")?.value),
    p_insurance_provider:v("o_insurance_provider")||null, p_policy_number:v("o_policy_number")||null,
    p_lease_start_date:v("o_lease_start")||null, p_lease_end_date:v("o_lease_end")||null,
    p_tenant_name:v("o_tenant_name")||null, p_tenant_phone:v("o_tenant_phone")||null, p_tenant_email:v("o_tenant_email")||null,
    p_acquisition_notes:v("o_acquisition_notes")||null
  });
  if(error){msg.innerHTML='<span class="error">'+escapeHtml(error.message)+'</span>';return;}
  msg.innerHTML='<span class="success">Onboarding details saved.</span>';
  setTimeout(()=>renderPropertyDetail(id),400);
}

async function saveProperty(id) {
  const msg = document.getElementById("editMsg");
  const val = id => document.getElementById(id).value.trim();
  const num = id => val(id) === "" ? null : Number(val(id));
  const updates = {
    name:val("e_name"), status:val("e_status"), address_line1:val("e_address"), city:val("e_city"), state:val("e_state"), postal_code:val("e_zip"),
    purchase_price:num("e_purchase"), current_value:num("e_value"), mortgage_balance:num("e_balance"), monthly_rent:num("e_rent"), monthly_mortgage_payment:num("e_payment"),
    annual_property_tax:num("e_tax"), annual_insurance:num("e_insurance"), monthly_hoa:num("e_hoa")
  };
  const {error} = await sb.from("properties").update(updates).eq("id",id);
  if(error){msg.innerHTML='<span class="error">'+escapeHtml(error.message)+'</span>';return;}
  msg.innerHTML='<span class="success">Property saved.</span>';
  setTimeout(()=>renderPropertyDetail(id),400);
}

async function openLaundromatSite(siteId){
  const host=document.getElementById('laundromatDetail'); if(!host)return;
  const [siteR,eqR,txR,mtR]=await Promise.all([
    sb.from('laundromat_sites').select('*').eq('id',siteId).maybeSingle(),
    sb.from('laundromat_equipment').select('id,name,equipment_type,quantity,purchase_cost,condition,service_date,notes').eq('site_id',siteId).order('name'),
    sb.from('laundromat_transactions').select('id,transaction_date,category,description,amount,transaction_type').eq('site_id',siteId).order('transaction_date',{ascending:false}),
    sb.from('laundromat_maintenance').select('id,title,status,estimated_cost,actual_cost,due_date').eq('site_id',siteId).order('created_at',{ascending:false})
  ]);
  const site=siteR.data, eq=eqR.data||[], tx=txR.data||[], mt=mtR.data||[];
  if(siteR.error||eqR.error||txR.error||mtR.error){host.innerHTML='<div class="error">Unable to load laundromat details.</div>';return;}

  const income=tx.filter(x=>x.transaction_type==='income');
  const expenses=tx.filter(x=>x.transaction_type==='expense');
  const totalIncome=income.reduce((a,x)=>a+Number(x.amount||0),0);
  const totalExpenses=expenses.reduce((a,x)=>a+Number(x.amount||0),0);
  const txDates=tx.map(x=>new Date((x.transaction_date||'').slice(0,10))).filter(d=>!Number.isNaN(d.getTime()));
  const firstDate=txDates.length?new Date(Math.min(...txDates.map(d=>d.getTime()))):null;
  const lastDate=txDates.length?new Date(Math.max(...txDates.map(d=>d.getTime()))):null;
  const months=firstDate&&lastDate?Math.max(1,(lastDate.getFullYear()-firstDate.getFullYear())*12+lastDate.getMonth()-firstDate.getMonth()+1):1;
  const monthlyRevenue=totalIncome/months;
  const monthlyExpenses=totalExpenses/months;
  const monthlyNOI=monthlyRevenue-monthlyExpenses;
  const debtService=Number(site.monthly_debt_service||0);
  const monthlyCashFlow=monthlyNOI-debtService;
  const annualCashFlow=monthlyCashFlow*12;
  const purchase=Number(site.purchase_price||0);
  const financing=Number(site.financing_amount||0);
  const cashInvested=Math.max(0,purchase-financing);
  const coc=cashInvested>0?(annualCashFlow/cashInvested)*100:null;
  const breakEvenRevenue=monthlyExpenses+debtService;
  const breakEvenPct=monthlyRevenue>0?(breakEvenRevenue/monthlyRevenue)*100:null;

async function loadDashboardPrimeRate(forceRefresh=false){
 const rateEl=document.getElementById("dashPrimeRate"),dateEl=document.getElementById("dashPrimeDate"),prevEl=document.getElementById("dashPrimePrevious"),changeEl=document.getElementById("dashPrimeChange"),histEl=document.getElementById("dashPrimeHistory"),sourceEl=document.getElementById("dashPrimeSource");
 if(!rateEl)return;
 try{
   rateEl.textContent="Loading…";
   sourceEl.textContent="Checking the latest official Federal Reserve data…";
   const cacheBust=forceRefresh?"?t="+Date.now():"?t="+Date.now();
   const response=await fetch(SUPABASE_URL+"/functions/v1/prime-rate"+cacheBust,{method:"GET",cache:"no-store",credentials:"omit"});
   const data=await response.json().catch(()=>({}));
   if(!response.ok)throw new Error(data?.error||("Prime-rate service returned HTTP "+response.status));
   const latest=data?.latest, hist=(data?.history||[]);
   if(!latest)throw new Error("No current prime-rate observation was returned.");
   const prev=data?.previous || (hist.length>1?hist[hist.length-2]:null);
   rateEl.textContent=Number(latest.rate).toFixed(2)+"%";
   dateEl.textContent=latest.date;
   prevEl.textContent=prev?Number(prev.rate).toFixed(2)+"%":"—";
   const delta=data?.change!=null?Number(data.change):(prev?Number(latest.rate)-Number(prev.rate):0);
   changeEl.textContent=prev?(delta>0?"+":"")+delta.toFixed(2)+"%":"—";
   const fetched=data?.fetched_at?new Date(data.fetched_at):null;
   sourceEl.textContent="Source: Board of Governors of the Federal Reserve System via FRED · Latest official observation: "+latest.date+(fetched?" · Data checked: "+fetched.toLocaleString():"");
   const recent=hist.slice(-10).reverse();
   histEl.innerHTML='<div class="card"><b>Recent daily history</b><div style="margin-top:10px">'+recent.map((x,i)=>'<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #eee"><span>'+escapeHtml(x.date)+(i===0?' <strong>(Latest)</strong>':'')+'</span><b>'+Number(x.rate).toFixed(2)+'%</b></div>').join('')+'</div></div>';
 }catch(e){rateEl.textContent="—";dateEl.textContent="—";prevEl.textContent="—";changeEl.textContent="—";sourceEl.textContent="Unable to retrieve the latest Federal Reserve data. Please try Refresh Rate again.";histEl.innerHTML='<div class="card"><b>Prime rate unavailable</b><p class="muted">'+escapeHtml(e.message||"Unable to load Federal Reserve data.")+'</p><button class="secondary" onclick="loadDashboardPrimeRate(true)">Try Again</button></div>';}
}

async function uploadJGAPDocument(){
  const file=document.getElementById('docFile')?.files?.[0], name=document.getElementById('docName')?.value.trim();
  if(file && file.size > 25*1024*1024){document.getElementById('docUploadStatus').textContent='File is larger than the 25 MB limit.';return;}
  const status=document.getElementById('docUploadStatus');
  if(!file){status.textContent='Choose a file first.';return;}
  if(!name){status.textContent='Enter a document name.';return;}
  status.textContent='Uploading...';
  try{
    const {data:{user}}=await sb.auth.getUser(); if(!user) throw new Error('Please sign in again.');
    const {data:member,error:me}=await sb.from('company_members').select('company_id').eq('user_id',user.id).limit(1).maybeSingle();
    if(me||!member?.company_id) throw me||new Error('Company authorization not found.');
    const prop=document.getElementById('docProperty').value||null;
    const safe=file.name.replace(/[^a-zA-Z0-9._-]+/g,'_');
    const path=member.company_id+'/'+crypto.randomUUID()+'_'+safe;
    const up=await sb.storage.from('documents').upload(path,file,{contentType:file.type||'application/octet-stream',upsert:false});
    if(up.error) throw up.error;
    const {error:dbErr}=await sb.rpc('create_current_user_document',{p_property_id:prop,p_name:name,p_storage_path:path,p_document_type:document.getElementById('docType').value,p_description:document.getElementById('docDescription').value||null,p_file_size:file.size,p_mime_type:file.type||null,p_deal_id:document.getElementById('docDeal')?.value||null});
    if(dbErr){await sb.storage.from('documents').remove([path]);throw dbErr;}
    status.textContent='Uploaded.'; document.getElementById('docFile').value=''; document.getElementById('docName').value=''; document.getElementById('docDescription').value=''; await loadJGAPDocuments();
  }catch(e){status.textContent='Upload failed: '+(e.message||e)}
}
async function loadJGAPDocuments(){
  const list=document.getElementById('docList'); if(!list)return; list.innerHTML='<div class="empty">Loading...</div>';
  let q=sb.from('documents').select('id,name,document_type,description,file_size,mime_type,storage_path,created_at,property_id,deal_id,properties(address_line1,city,state,postal_code),deals(name)').order('created_at',{ascending:false});
  const f=document.getElementById('docFilter')?.value; if(f) q=q.eq('property_id',f); const df=document.getElementById('docDealFilter')?.value; if(df) q=q.eq('deal_id',df);
  const tf=document.getElementById('docTypeFilter')?.value; if(tf) q=q.eq('document_type',tf);
  const {data,error}=await q; if(error){list.innerHTML='<div class="empty">Unable to load documents: '+escapeHtml(error.message)+'</div>';return;}

  if(!rows.length){list.innerHTML='<div class="empty">No documents match your filters.</div>';return;}
  list.innerHTML=rows.map(d=>{const size=d.file_size?((d.file_size/1024/1024).toFixed(2)+' MB'):'—';const prop=[d.properties?.address_line1,d.properties?.city,d.properties?.state,d.properties?.postal_code].filter(Boolean).join(', ')||'Company / General';const deal=d.deals?.name||'';return `<div class="card" style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><b>${escapeHtml(d.name)}</b><div class="muted">${escapeHtml(d.document_type||'General')} • ${escapeHtml(prop)}${deal?' • Deal: '+escapeHtml(deal):''} • ${size}</div>${d.description?'<div class="muted">'+escapeHtml(d.description)+'</div>':''}</div><div style="display:flex;gap:7px;flex-wrap:wrap"><button class="secondary" onclick="openJGAPDocument('${d.id}','${encodeURIComponent(d.storage_path)}')">Open</button><button class="secondary" onclick="deleteJGAPDocument('${d.id}','${encodeURIComponent(d.storage_path)}')">Delete</button></div></div></div>`}).join('');
}
async function deleteJGAPDocument(id,encodedPath){
  if(!confirm('Delete this document? This cannot be undone.')) return;
  try{
    const path=decodeURIComponent(encodedPath);
    const {error:storageError}=await sb.storage.from('documents').remove([path]);
    if(storageError) throw storageError;
    const {error:dbError}=await sb.from('documents').delete().eq('id',id);
    if(dbError) throw dbError;
    await loadJGAPDocuments();
  }catch(e){alert('Unable to delete document: '+(e.message||e));}
}

async function loadJGAPAuditLog(){
  const el=document.getElementById('uaAuditLog'); if(!el)return;
  el.innerHTML='<div class="empty">Loading activity...</div>';
  const {data,error}=await sb.from('audit_logs').select('id,action,entity_type,entity_id,details,created_at,user_id').order('created_at',{ascending:false}).limit(100);
  if(error){el.innerHTML='<div class="empty">Unable to load activity.</div>';return;}
  if(!data?.length){el.innerHTML='<div class="empty">No activity has been recorded yet.</div>';return;}
  const ids=[...new Set(data.map(x=>x.user_id).filter(Boolean))]; let emails={};
  if(ids.length){const {data:members}=await sb.from('company_members').select('user_id').in('user_id',ids);}
  el.innerHTML=data.map(x=>{const when=new Date(x.created_at).toLocaleString(); const type=x.entity_type||'record'; const action=x.action||'Changed'; return `<div style="padding:10px 0;border-bottom:1px solid #e5e7eb"><b>${escHtml(action)}</b> <span class="muted">${escHtml(type)}</span><div class="muted" style="font-size:12px;margin-top:3px">${escHtml(when)}</div></div>`}).join('');
}
function escHtml(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
async function exportJGAPBackup(){
  const status=document.getElementById('uaExportStatus'); if(status)status.textContent='Preparing backup...';
  const tables=['companies','company_members','properties','deals','repairs','tasks','financial_transactions','documents','projects','property_tenants','property_leases','property_rent_payments','multifamily_buildings','multifamily_units','multifamily_tenants','multifamily_leases','deal_checklist_items','deal_closing_trackers','company_invitations','laundromat_sites','laundromat_equipment','laundromat_transactions','laundromat_maintenance','audit_logs'];
  const backup={exported_at:new Date().toISOString(),format:'JGAP Venture Group backup v1',tables:{}};
  for(const table of tables){const {data,error}=await sb.from(table).select('*'); if(!error)backup.tables[table]=data||[];}
  const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='JGAP_Venture_Group_Backup_'+new Date().toISOString().slice(0,10)+'.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); if(status)status.textContent='Backup downloaded successfully.';
}
async function changeJGAPEmail(){
  const input=document.getElementById('uaNewEmail'), status=document.getElementById('uaEmailStatus');
  const newEmail=(input?.value||'').trim().toLowerCase();
  if(!newEmail){alert('Enter the new email address.');return;}
  const {data:{user}}=await sb.auth.getUser();
  const current=(user?.email||'').toLowerCase();
  if(newEmail===current){alert('That is already the email on this account.');return;}
  if(status) status.textContent='Sending confirmation...';
  const {error}=await sb.auth.updateUser({email:newEmail});
  if(error){if(status) status.textContent='Unable to change email: '+error.message;alert('Unable to change email: '+error.message);return;}
  if(status) status.textContent='Confirmation email sent. Follow the confirmation link to finish changing your login email.';
  if(input) input.value='';
}
async function loadJGAPUsersAccess(){
  const status=document.getElementById('uaStatus'); if(!status)return;
  const {data,error}=await sb.rpc('list_current_user_company_access');
  if(error){status.textContent='Unable to load access: '+error.message;return;}
  const members=data?.members||[], invites=data?.invitations||[], role=data?.role||'member';
  status.textContent='Your role: '+role.charAt(0).toUpperCase()+role.slice(1);
  const me=(await sb.auth.getUser()).data.user?.id;
  document.getElementById('uaMembers').innerHTML=members.length?members.map(m=>`<div class="card" style="margin-bottom:8px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><div><b>${escapeHtml(m.email||'User')}</b><div class="muted">${escapeHtml(m.role)} • Added ${new Date(m.created_at).toLocaleDateString()}</div></div>${m.role==='owner'||m.user_id===me?'<span class="pill">'+(m.role==='owner'?'Owner':'You')+'</span>':(role==='owner'||role==='admin'?`<div><select onchange="changeJGAPRole('${m.user_id}',this.value)"><option value="member"${m.role==='member'?' selected':''}>Member</option><option value="admin"${m.role==='admin'?' selected':''}>Admin</option></select> <button class="secondary" onclick="removeJGAPUser('${m.user_id}')">Remove</button></div>`:'')}</div>`).join(''):'<div class="empty">No active users yet.</div>';
  document.getElementById('uaInvites').innerHTML=invites.filter(i=>i.status==='pending').length?invites.filter(i=>i.status==='pending').map(i=>`<div class="card" style="margin-bottom:8px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><div><b>${escapeHtml(i.email)}</b><div class="muted">${escapeHtml(i.role)} • Invited ${new Date(i.created_at).toLocaleDateString()}</div></div>${role==='owner'||role==='admin'?`<button class="secondary" onclick="cancelJGAPInvite('${i.id}')">Cancel</button>`:''}</div>`).join(''):'<div class="empty">No pending invitations.</div>';
}

<script>
// JGAP in-app browser history: keep browser Back inside the app and keep
// the address bar on the actual app URL. Navigation creates real app history entries.
(function(){
  const APP_URL = window.location.href;
  window.__JGAP_APP_URL = APP_URL;
  const navNames = [
    'renderDealsPage','renderDocumentsPage','renderPropertiesPage','renderPropertyDetail',
    'renderPropertyManagementPage','renderRepairsPage','renderFinancesPage',
    'renderProjectsPage','renderReportsPage','renderInvestmentsPage',
    'renderDealAnalyzer','renderContractorsPage','renderRehabPage','renderRentRoll'
  ];
  const originals = {};
  navNames.forEach(name => {
    if (typeof window[name] === 'function') originals[name] = window[name];
  });
  if (typeof window.render === 'function') originals.render = window.render;

  function sameState(a,b){
    if(!a || !b || a.jgap !== true || b.jgap !== true) return false;
    return a.route===b.route && JSON.stringify(a.args||[])===JSON.stringify(b.args||[]);
  }
  function pushRoute(route,args){
    if(window.__jgapHistoryHandling) return;
    const next={jgap:true,route,args:Array.isArray(args)?args:[]};
    if(sameState(history.state,next)) return;
    history.pushState(next,'',APP_URL);
  }

  const rootState={jgap:true,route:'dashboard',args:[]};
  if(!history.state || history.state.jgap!==true){
    history.replaceState(rootState,'',APP_URL);
  } else if(!history.state.route){
    history.replaceState(rootState,'',APP_URL);
  }

  // render() is also used for refreshes/auth updates, so it must never create
  // a fake Dashboard history entry. Only explicit navigation does that.
  navNames.forEach(name=>{
    if(!originals[name]) return;
    window[name]=function(){
      const args=[...arguments];
      pushRoute(name,args);
      return originals[name].apply(this,args);
    };
  });

  window.addEventListener('popstate', function(e){
    const st=e.state;
    if(!st || st.jgap!==true){
      // Restore the app URL instead of allowing Back to leave the app.
      history.pushState(rootState,'',APP_URL);
      window.__jgapHistoryHandling=true;
      try{ originals.render && originals.render(); } finally { window.__jgapHistoryHandling=false; }
      return;
    }
    const fn = st.route==='dashboard' ? originals.render : originals[st.route];
    if(!fn) return;
    window.__jgapHistoryHandling=true;
    try{ fn.apply(window,st.args||[]); } finally { window.__jgapHistoryHandling=false; }
  });
})();
</script>

<script>
async function markPropertySoldUI(propertyId){
  const date=prompt("Sale date (YYYY-MM-DD):", new Date().toISOString().slice(0,10));
  if(date===null)return;
  const price=prompt("Sale price:", "");
  if(price===null)return;
  const notes=prompt("Sale notes (optional):","") ?? "";
  const {error}=await sb.rpc("mark_current_user_property_sold",{
    p_property_id:propertyId,
    p_sold_date:date || new Date().toISOString().slice(0,10),
    p_sale_price:price===""?null:Number(price),
    p_sale_notes:notes || null
  });
  if(error){alert(error.message);return;}
  alert("Property marked as sold. The property history has been preserved.");
  if(typeof render==="function") render();
}

async function toggleProjectDueDiligence(projectId){
 const host=document.getElementById('dd_'+projectId); if(!host)return;
 if(host.style.display==='block'){host.style.display='none';return;} host.style.display='block'; host.innerHTML='Loading due diligence...';
 const {data,error}=await sb.from('project_due_diligence').select('*').eq('project_id',projectId).order('created_at');
 if(error){host.innerHTML='<div class="error">'+escapeHtml(error.message)+'</div>';return;}
 const items=data||[]; const done=items.filter(x=>x.status==='complete').length;
 host.innerHTML=`<div class="panel"><div class="sectionTitle">🔎 Due Diligence <span class="muted">${done}/${items.length} complete</span></div><p class="muted">Track inspections, title, permits, utilities, financing and other pre-close checks for this flip.</p>
 ${items.length?'<div style="overflow:auto"><table class="table"><thead><tr><th>Item</th><th>Status</th><th>Notes</th><th></th></tr></thead><tbody>'+items.map(x=>`<tr><td>${escapeHtml(x.item)}</td><td><select onchange="updateProjectDueDiligence('${x.id}',this.value)"><option value="pending" ${x.status==='pending'?'selected':''}>Pending</option><option value="complete" ${x.status==='complete'?'selected':''}>Complete</option><option value="issue" ${x.status==='issue'?'selected':''}>Issue</option></select></td><td>${escapeHtml(x.notes||'—')}</td><td>${x.status==='issue'?'<span class="error">Issue</span>':''}</td></tr>`).join('')+'</tbody></table></div>':'<p class="muted">No checklist items yet.</p>'}
 <div class="formGrid"><label>Checklist item<input id="dd_item_${projectId}" placeholder="Example: Home inspection"></label><label>Notes<input id="dd_notes_${projectId}" placeholder="Findings / next step"></label></div><button class="primary" onclick="addProjectDueDiligence('${projectId}')">Add Checklist Item</button><button class="secondary" onclick="seedProjectDueDiligence('${projectId}')">Add Standard Checklist</button></div>`;
}
async function addProjectDueDiligence(projectId){const item=document.getElementById('dd_item_'+projectId)?.value.trim();const notes=document.getElementById('dd_notes_'+projectId)?.value||'';if(!item){alert('Enter a checklist item.');return;}const {error}=await sb.rpc('create_current_user_project_due_diligence',{p_project_id:projectId,p_item:item,p_notes:notes});if(error){alert(error.message);return;}await toggleProjectDueDiligence(projectId);toggleProjectDueDiligence(projectId);}
async function updateProjectDueDiligence(id,status){const {data,error}=await sb.rpc('update_current_user_project_due_diligence',{p_id:id,p_status:status,p_notes:null});if(error){alert(error.message);return;}loadProjects();}
async function seedProjectDueDiligence(projectId){const defaults=['Home inspection','Title search / ownership verification','Survey / boundary review','Permit / zoning review','Utility review','Insurance quote','Financing approval','Contract / closing document review','Repair scope / contractor bids','Final walk-through'];for(const item of defaults){const {error}=await sb.rpc('create_current_user_project_due_diligence',{p_project_id:projectId,p_item:item,p_notes:null});if(error){alert(error.message);return;}}await loadProjects();setTimeout(()=>toggleProjectDueDiligence(projectId),150);}
</script>
