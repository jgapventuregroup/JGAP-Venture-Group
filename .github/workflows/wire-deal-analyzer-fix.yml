name: Wire Deal Analyzer Fix

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  wire-fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'deal-analyzer-safe-fix-2026-10-01'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: deal-analyzer-safe-fix-2026-10-01
          fetch-depth: 1

      - name: Wire Deal Analyzer fix into app shell
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f deal-analyzer-stage-fix.js
          if grep -q 'deal-analyzer-stage-fix.js' index.html; then
            echo 'Deal Analyzer fix already wired.'
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script defer src="./learning-book-runtime.js?v=20261001-1"></script>'
          loader = '<script defer src="./deal-analyzer-stage-fix.js?v=20261001-1"></script>'
          if marker not in s:
              raise SystemExit('Expected script marker was not found; refusing to edit index.html.')
          s = s.replace(marker, marker + loader, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit wiring change
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'No wiring change required.'
            exit 0
          fi
          git config user.name 'JGAP Venture Group Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Wire Deal Analyzer stage fix into app shell'
          git push origin HEAD:deal-analyzer-safe-fix-2026-10-01
