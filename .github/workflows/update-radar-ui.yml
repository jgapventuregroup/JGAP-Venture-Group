name: Update Radar UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-radar-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Radar UI
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          original = s

          # Keep the Radar query aligned with the current triage fields when the
          # existing source uses a plain opportunity_score select expression.
          if 'jgap_fit_score' not in s and 'opportunity_score' in s:
              s = s.replace('opportunity_score', 'opportunity_score,jgap_fit_score,jgap_fit_reason,review_priority,recommended_action,missing_data,target_fit,target_fit_reason', 1)

          # Add a lightweight client-side Radar filter/triage bar. This is deliberately
          # DOM-based so it does not require replacing the existing Radar renderer.
          marker = '</body>'
          if 'id="jgapRadarFilters"' not in s and marker in s:
              inject = r'''<script>
(function(){
  function initJGAPRadarFilters(){
    if(document.getElementById('jgapRadarFilters')) return true;
    var text=(document.body.innerText||'').toLowerCase();
    if(text.indexOf('deal radar')===-1) return false;
    var tables=document.querySelectorAll('table');
    if(!tables.length) return false;
    var table=null;
    for(var i=0;i<tables.length;i++){
      var h=(tables[i].innerText||'').toLowerCase();
      if(h.indexOf('opportunity')!==-1 && h.indexOf('status')!==-1){table=tables[i];break;}
    }
    if(!table) return false;
    var head=table.querySelector('thead tr');
    if(!head) return false;
    var headers=[].slice.call(head.children).map(function(x){return (x.innerText||'').trim().toLowerCase();});
    var locIdx=headers.indexOf('location');
    var priorityIdx=headers.indexOf('priority');
    var targetIdx=headers.indexOf('target fit');
    if(targetIdx===-1){
      var th=document.createElement('th'); th.textContent='Target Fit'; head.appendChild(th); targetIdx=head.children.length-1;
    }
    var rows=table.querySelectorAll('tbody tr');
    rows.forEach(function(row){
      var cells=row.children;
      if(!cells.length) return;
      var loc=locIdx>=0&&cells[locIdx]?(cells[locIdx].innerText||'').toLowerCase():'';
      var fit=(loc.indexOf('bristol')>=0||loc.indexOf('kingsport')>=0||loc.indexOf('johnson city')>=0)?'target':'outside_target';
      if(cells[targetIdx]){cells[targetIdx].textContent=fit;}
      else{var td=document.createElement('td');td.textContent=fit;row.appendChild(td);}
    });
    var host=document.querySelector('.pageHead')||document.querySelector('main')||document.body;
    var bar=document.createElement('div'); bar.id='jgapRadarFilters'; bar.className='toolbar'; bar.style.margin='0 0 14px';
    bar.innerHTML='<label style="font-size:12px;font-weight:700">Target <select id="jgapTargetFilter" style="width:auto;margin:0 8px 0 4px"><option value="all">All</option><option value="target">Target</option><option value="outside_target">Outside Target</option></select></label><label style="font-size:12px;font-weight:700">Priority <select id="jgapPriorityFilter" style="width:auto;margin:0 8px 0 4px"><option value="all">All</option><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option></select></label>';
    if(host.firstChild) host.parentNode.insertBefore(bar,host.nextSibling); else host.appendChild(bar);
    function apply(){
      var tf=document.getElementById('jgapTargetFilter').value, pf=document.getElementById('jgapPriorityFilter').value;
      table.querySelectorAll('tbody tr').forEach(function(row){
        var c=row.children, loc=locIdx>=0&&c[locIdx]?(c[locIdx].innerText||'').toLowerCase():'';
        var fit=(loc.indexOf('bristol')>=0||loc.indexOf('kingsport')>=0||loc.indexOf('johnson city')>=0)?'target':'outside_target';
        var pri=priorityIdx>=0&&c[priorityIdx]?(c[priorityIdx].innerText||'').toLowerCase():'';
        row.style.display=(tf!=='all'&&fit!==tf)||(pf!=='all'&&pri.indexOf(pf)===-1)?'none':'';
      });
    }
    document.getElementById('jgapTargetFilter').onchange=apply;
    document.getElementById('jgapPriorityFilter').onchange=apply;
    return true;
  }
  var tries=0, timer=setInterval(function(){if(initJGAPRadarFilters()||++tries>40)clearInterval(timer);},500);
})();
</script>'''
              s=s.replace(marker,inject+'\n'+marker,1)

          if s != original:
              p.write_text(s, encoding='utf-8')
              print('Radar filter UI updated.')
          else:
              print('No Radar filter patch needed.')

      - name: Commit Radar UI patch
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Deal Radar target and priority filters"
          git push
