name: Restore JGAP stable app
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    if: "!contains(github.event.head_commit.message, 'Restore JGAP stable app')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore and validate verified application baseline
        shell: bash
        run: |
          set -euo pipefail
          git show 3a1b3e1b47ca8cfe8d08974a9598dabebbbc9d32:index.html > index.html
          git show dc00e9c4e7d4b819f5dfb50b377d9f68184b2d47:radar-filters.js > radar-filters.js
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          # Remove only trailing whitespace; preserve all application content.
          lines=s.splitlines()
          s='\n'.join(line.rstrip() for line in lines)+'\n'
          tag='<script defer src="./celoc-analyzer.js?v=20261005-1"></script>'
          if tag not in s:
              marker='</body>'
              if marker not in s:
                  raise SystemExit('Verified baseline index.html has no </body>; refusing unsafe edit')
              s=s.replace(marker, tag+'\n'+marker, 1)
          p.write_text(s,encoding='utf-8')
          PY
          test -s index.html
          test -s radar-filters.js
          test -s celoc-analyzer.js
          grep -q 'celoc-analyzer.js?v=20261005-1' index.html
          grep -q '<script' index.html
          git diff --check
      - name: Commit restored application
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html radar-filters.js
          if git diff --cached --quiet; then
            echo "No application changes needed."
            exit 0
          fi
          git commit -m "Restore JGAP stable app"
          git push