name: Install isolated CELOC module
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-radar-ui.yml'
permissions:
  contents: write
jobs:
  install:
    if: "!contains(github.event.head_commit.message, 'Install isolated CELOC module')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Validate and install isolated CELOC loader
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s radar-filters.js
          test -s celoc-analyzer.js
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script defer src="./celoc-analyzer.js?v=20261005-1"></script>'
          if tag not in s:
              marker='</head>'
              if marker not in s:
                  raise SystemExit('index.html has no </head>; refusing unsafe edit')
              s=s.replace(marker, tag+'\n'+marker, 1)
              p.write_text(s,encoding='utf-8')
              print('Installed isolated CELOC loader')
          else:
              print('CELOC loader already installed')
          PY
          grep -q 'celoc-analyzer.js?v=20261005-1' index.html
          git diff --check
      - name: Commit isolated CELOC loader
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'CELOC loader already present; no commit needed.'
            exit 0
          fi
          git commit -m 'Install isolated CELOC module'
          git push