name: Update Radar UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-radar-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Radar UI
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          original = s

          # Keep the Radar query aligned with the current triage fields.
          if 'jgap_fit_score' not in s and 'opportunity_score' in s:
              s = s.replace('opportunity_score', 'opportunity_score,jgap_fit_score,jgap_fit_reason,review_priority,recommended_action,missing_data,target_fit,target_fit_reason', 1)
          elif 'jgap_fit_score' in s:
              for field in ['recommended_action','missing_data','target_fit','target_fit_reason']:
                  if field not in s:
                      s = s.replace('review_priority', 'review_priority,' + field, 1)

          # Add Target Fit to the Radar table once.
          old_header = "'<th>Opportunity</th><th>Location</th><th>Units</th><th>Asking Price</th><th>Cap / DSCR</th><th>JGAP Fit</th><th>Priority</th><th>Next Action</th><th>Missing Data</th><th>Status</th><th>Actions</th>'+"
          new_header = "'<th>Opportunity</th><th>Location</th><th>Units</th><th>Asking Price</th><th>Cap / DSCR</th><th>JGAP Fit</th><th>Priority</th><th>Target Fit</th><th>Next Action</th><th>Missing Data</th><th>Status</th><th>Actions</th>'+"
          if old_header in s and 'Target Fit</th>' not in s:
              s = s.replace(old_header, new_header, 1)

          priority_cell = "'<td><span class=\"pill\">'+escapeHtml(r.review_priority||'—')+'</span></td>'+"
          target_cell = "'<td><span class=\"pill\">'+escapeHtml(r.target_fit||'—')+'</span>'+(r.target_fit_reason?'<div class=\"muted\" style=\"font-size:11px\">'+escapeHtml(r.target_fit_reason)+'</div>':'')+'</td>'+"
          if priority_cell in s and 'r.target_fit' not in s:
              s = s.replace(priority_cell, priority_cell + '\n        ' + target_cell, 1)

          if s != original:
              p.write_text(s, encoding='utf-8')
              print('Radar UI updated.')
          else:
              print('No Radar UI patch needed.')

      - name: Commit Radar UI patch
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add index.html
          git commit -m "Update Deal Radar target fit display"
          git push
