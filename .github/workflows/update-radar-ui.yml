name: Repair JGAP using exact HTML head boundary
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-radar-ui.yml'
permissions:
  contents: write
jobs:
  repair:
    if: "!contains(github.event.head_commit.message, 'Repair JGAP using exact HTML head boundary')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore verified baseline
        shell: bash
        run: |
          set -euo pipefail
          git show 3a1b3e1b47ca8cfe8d08974a9598dabebbbc9d32:index.html > index.html
          git show dc00e9c4e7d4b819f5dfb50b377d9f68184b2d47:radar-filters.js > radar-filters.js
          test -s index.html
          test -s radar-filters.js
          test -s celoc-analyzer.js
      - name: Install CELOC at the real head/body boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script defer src="./celoc-analyzer.js?v=20261005-1"></script>'
          s=s.replace(tag,'')
          marker='</head>\n<body>'
          if marker not in s:
              raise SystemExit('Verified baseline did not contain the exact </head>\\n<body> boundary; refusing unsafe edit')
          if s.count(marker)!=1:
              raise SystemExit('Expected exactly one HTML head/body boundary')
          s=s.replace(marker,tag+'\n</head>\n<body>',1)
          p.write_text(s,encoding='utf-8')
          if s.count(tag)!=1:
              raise SystemExit('CELOC loader count is not exactly one')
          PY
      - name: Validate the complete repaired application
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s radar-filters.js
          test -s celoc-analyzer.js
          test "$(grep -o 'celoc-analyzer.js?v=20261005-1' index.html | wc -l)" -eq 1
          grep -q '</head>\n<body>' index.html
          node --check radar-filters.js
          node --check celoc-analyzer.js
          python - <<'PY'
          import re, subprocess, tempfile
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          # Validate inline scripts only; external scripts are checked separately.
          blocks=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>',s,re.I)
          for i,b in enumerate(blocks):
              if not b.strip(): continue
              with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
                  f.write(b)
                  name=f.name
              r=subprocess.run(['node','--check',name],capture_output=True,text=True)
              if r.returncode:
                  raise SystemExit(f'Inline script {i} failed syntax check: {r.stderr}')
          print(f'Validated {len(blocks)} inline script blocks')
          PY
          git diff --check
      - name: Commit verified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html radar-filters.js
          if git diff --cached --quiet; then
            echo 'No repair changes needed.'
            exit 0
          fi
          git commit -m 'Repair JGAP using exact HTML head boundary'
          git push