name: Update Radar UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-radar-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Radar UI
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          original = s

          # Keep the Radar query aligned with the current triage fields.
          if 'jgap_fit_score' not in s and 'opportunity_score' in s:
              s = s.replace('opportunity_score', 'opportunity_score,jgap_fit_score,jgap_fit_reason,review_priority,recommended_action,missing_data', 1)
          elif 'jgap_fit_score' in s:
              # Add only fields that are still missing from the select expression.
              for field in ['recommended_action','missing_data']:
                  if field not in s:
                      s = s.replace('review_priority', 'review_priority,' + field, 1)

          # Upgrade the Radar header once, preserving the existing layout.
          old_header = "'<th>Opportunity</th><th>Location</th><th>Units</th><th>Asking Price</th><th>Cap / DSCR</th><th>JGAP Fit</th><th>Priority</th><th>Status</th><th>Actions</th>'+"
          new_header = "'<th>Opportunity</th><th>Location</th><th>Units</th><th>Asking Price</th><th>Cap / DSCR</th><th>JGAP Fit</th><th>Priority</th><th>Next Action</th><th>Missing Data</th><th>Status</th><th>Actions</th>'+"
          if old_header in s and 'Next Action' not in s:
              s = s.replace(old_header, new_header, 1)

          # Add triage details after the priority cell if the older version is present.
          priority_cell = "'<td><span class=\"pill\">'+escapeHtml(r.review_priority||'—')+'</span></td>'+"
          triage_cells = "'<td><b>'+escapeHtml(r.recommended_action||'—')+'</b></td>'+\n        '<td>'+(r.missing_data?'<span class=\"muted\" style=\"font-size:11px\">'+escapeHtml(r.missing_data)+'</span>':'—')+'</td>'+"
          if priority_cell in s and 'r.recommended_action' not in s:
              s = s.replace(priority_cell, priority_cell + '\n        ' + triage_cells, 1)

          if s != original:
              p.write_text(s, encoding='utf-8')
              print('Radar UI updated.')
          else:
              print('No Radar UI patch needed.')

      - name: Commit Radar UI patch
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update Deal Radar triage display"
          git push
