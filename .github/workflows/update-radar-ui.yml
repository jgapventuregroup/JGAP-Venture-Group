name: Update Radar UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update-radar-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore known-good JGAP application and CELOC
        shell: bash
        run: |
          set -e
          git show 3a1b3e1b47ca8cfe8d08974a9598dabebbbc9d32:index.html > index.html
          git show 36fb914faf73c475d34401e3180968eb0f7b78e4:radar-filters.js > radar-filters.js
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='./radar-filters.js?v=20261004-3'
          new='./radar-filters.js?v=20261005-1'
          if old not in s:
              raise SystemExit('Stable index did not contain the expected Radar asset reference; refusing unsafe edit')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
      - name: Commit restored application
        run: |
          if git diff --quiet -- index.html radar-filters.js; then
            echo "JGAP application is already restored."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html radar-filters.js
          git commit -m "Restore full JGAP app and enable CELOC safely"
          git push