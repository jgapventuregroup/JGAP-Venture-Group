name: Deploy Radar Filters

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/radar-filters-deploy.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Radar filter script
        run: |
          cat > radar-filters.js <<'EOF'
          (function(){
            function init(){
              if(document.getElementById('jgapRadarFilters')) return true;
              var tables=document.querySelectorAll('table');
              var table=null;
              for(var i=0;i<tables.length;i++){
                var txt=(tables[i].innerText||'').toLowerCase();
                if(txt.indexOf('opportunity')>=0 && txt.indexOf('status')>=0){table=tables[i];break;}
              }
              if(!table) return false;
              var rows=table.querySelectorAll('tbody tr');
              if(!rows.length) return false;
              var headers=table.querySelectorAll('th');
              var loc=-1,pri=-1;
              for(var i=0;i<headers.length;i++){
                var h=(headers[i].innerText||'').trim().toLowerCase();
                if(h==='location') loc=i;
                if(h==='priority') pri=i;
              }
              var bar=document.createElement('div');
              bar.id='jgapRadarFilters';
              bar.style.cssText='display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:0 0 16px;padding:12px 14px;background:#fff;border:1px solid #e2e7ef;border-radius:12px;';
              bar.innerHTML='<label style="font-weight:700;font-size:13px">Target <select id="jgapTargetFilter"><option value="all">All</option><option value="target">Target</option><option value="outside">Outside Target</option></select></label><label style="font-weight:700;font-size:13px">Priority <select id="jgapPriorityFilter"><option value="all">All</option><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option></select></label>';
              table.parentNode.insertBefore(bar,table);
              function apply(){
                var tf=document.getElementById('jgapTargetFilter').value;
                var pf=document.getElementById('jgapPriorityFilter').value;
                table.querySelectorAll('tbody tr').forEach(function(row){
                  var c=row.children;
                  var location=loc>=0&&c[loc]?(c[loc].innerText||'').toLowerCase():'';
                  var fit=(location.indexOf('bristol')>=0||location.indexOf('kingsport')>=0||location.indexOf('johnson city')>=0)?'target':'outside';
                  var priority=pri>=0&&c[pri]?(c[pri].innerText||'').toLowerCase():'';
                  row.style.display=(tf!=='all'&&fit!==tf)||(pf!=='all'&&priority.indexOf(pf)<0)?'none':'';
                });
              }
              document.getElementById('jgapTargetFilter').onchange=apply;
              document.getElementById('jgapPriorityFilter').onchange=apply;
              return true;
            }
            var n=0,t=setInterval(function(){if(init()||++n>30)clearInterval(t);},500);
          })();
          EOF

      - name: Wire script into app
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script defer src="./radar-filters.js?v=20261003-2"></script>'
          if tag not in s:
              anchor = '<script defer src="./learning-book-runtime.js?v=20261001-1"></script>'
              if anchor not in s:
                  raise SystemExit('Could not find stable script anchor in index.html')
              s = s.replace(anchor, anchor + tag, 1)
              p.write_text(s, encoding='utf-8')
              print('Radar filter script wired into index.html')
          else:
              print('Radar filter script already wired')
          PY

      - name: Commit generated files
        run: |
          if git diff --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html radar-filters.js
          git commit -m 'Wire Radar filters into app'
          git push
