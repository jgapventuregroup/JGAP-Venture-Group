name: Verify Learning Book Runtime

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Learning Book runtime is wired
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'learning-book-runtime.js?v=20261001-1' index.html
          test -f learning-book-runtime.js
          echo 'Learning Book runtime is wired and present.'
