name: Wire Learning Book Export

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load book export runtime
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script defer src="./learning-book-runtime.js?v=20261001-1"></script>'
          anchor='<script defer src="./learning-book.js?v=20260930-1125"></script>'
          if tag not in s:
              if anchor not in s:
                  raise SystemExit('learning-book script anchor not found')
              s=s.replace(anchor, anchor+'\n'+tag, 1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit wired runtime
        shell: bash
        run: |
          git config user.name "JGAP Book Builder"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Load JGAP book export runtime"
          git push