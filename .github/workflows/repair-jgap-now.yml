name: Restore exact known-good JGAP app
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-jgap-now.yml'
permissions:
  contents: write
jobs:
  repair:
    if: "!contains(github.event.head_commit.message, 'Restore exact known-good app without inline CELOC injection')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact verified baseline
        shell: bash
        run: |
          set -euo pipefail
          git show 3a1b3e1b47ca8cfe8d08974a9598dabebbbc9d32:index.html > index.html
          git show 36fb914faf73c475d34401e3180968eb0f7b78e4:radar-filters.js > radar-filters.js
          test -s index.html
          test -s radar-filters.js
      - name: Set a fresh Radar asset version only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='./radar-filters.js?v=20261004-3'
          new='./radar-filters.js?v=20261005-1'
          if old not in s:
              raise SystemExit('Expected stable Radar reference not found; refusing unsafe edit')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify CELOC is not injected into index.html
        shell: bash
        run: |
          set -euo pipefail
          if grep -n 'celoc-analyzer\|jgapCeloc' index.html; then
            echo 'Unsafe: CELOC code found inside index.html.'
            exit 1
          fi
          test "$(grep -o 'radar-filters.js?v=20261005-1' index.html | wc -l)" -eq 1
      - name: Syntax-check application JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check radar-filters.js
          python - <<'PY'
          import re, subprocess, tempfile
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>',s,re.I)
          for i,b in enumerate(blocks):
              if not b.strip():
                  continue
              with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
                  f.write(b)
                  name=f.name
              r=subprocess.run(['node','--check',name],capture_output=True,text=True)
              if r.returncode:
                  raise SystemExit(f'Inline script {i} failed syntax check:\n{r.stderr}')
          print(f'Validated {len(blocks)} inline script blocks')
          PY
          git diff --check
      - name: Commit verified app
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html radar-filters.js
          if git diff --cached --quiet; then
            echo 'Verified baseline already present.'
            exit 0
          fi
          git commit -m 'Restore exact known-good app without inline CELOC injection'
          git push