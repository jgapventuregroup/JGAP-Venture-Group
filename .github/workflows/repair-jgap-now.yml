name: Fix actual JGAP startup token
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-jgap-now.yml'
permissions:
  contents: write
jobs:
  repair:
    if: "!contains(github.event.head_commit.message, 'Fix actual JGAP startup token in rent statement template')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Remove the exact bad CELOC injection from the print template
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          bad='\n<script defer src="./celoc-analyzer.js?v=20261005-1"></script>'
          count=s.count(bad)
          print(f'Found exact bad CELOC template injection: {count}')
          if count == 0:
              raise SystemExit('Expected bad CELOC injection was not found; refusing to claim repair')
          if count != 1:
              raise SystemExit(f'Expected exactly one bad injection, found {count}')
          s=s.replace(bad,'',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Prove the startup parser is clean
        shell: bash
        run: |
          set -euo pipefail
          if grep -n 'celoc-analyzer.js?v=20261005-1' index.html; then
            echo 'Unsafe: CELOC injection still exists in index.html'
            exit 1
          fi
          node --check radar-filters.js
          python - <<'PY'
          import re, subprocess, tempfile
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>',s,re.I)
          for i,b in enumerate(blocks):
              if not b.strip():
                  continue
              with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
                  f.write(b)
                  name=f.name
              r=subprocess.run(['node','--check',name],capture_output=True,text=True)
              if r.returncode:
                  raise SystemExit(f'Inline script {i} failed syntax check:\n{r.stderr}')
          print(f'Validated {len(blocks)} inline script blocks')
          PY
          git diff --check
      - name: Commit the actual fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix actual JGAP startup token'
          git push