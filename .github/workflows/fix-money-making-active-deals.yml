name: Fix Money-Making Active Deals

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Patch active deal stages
        shell: python
        run: |
          from pathlib import Path
          p = Path('money-making-system.js')
          s = p.read_text(encoding='utf-8')
          old = "['lead','underwriting','offer','due_diligence','closing']"
          new = "['lead','analyzing','underwriting','offer','due_diligence','closing']"
          if new in s:
              print('ALREADY_FIXED')
          elif old in s:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
              print('PATCHED')
          else:
              raise SystemExit('Expected active deal status list was not found; refusing to modify the file.')

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- money-making-system.js; then
            echo 'No change required.'
            exit 0
          fi
          git config user.name 'JGAP Venture Group'
          git config user.email 'jgapventuregroup@gmail.com'
          git add money-making-system.js
          git commit -m '[money-making] Include analyzing deals in active pipeline'
          git push