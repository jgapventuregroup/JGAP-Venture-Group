name: Verify Deal Pipeline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify secure Deal Pipeline query
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'sb.rpc("list_current_user_deals")' index.html
          echo 'Deal Pipeline secure RPC is present.'
