name: Verify staging preview without publishing over production
on:
  push:
    branches: [jgap-staging-workspace]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify staging application
        run: node staging/verify.mjs
      - name: Save staging files as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: jgap-staging-preview-files
          path: staging
