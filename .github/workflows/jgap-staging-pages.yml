name: Publish isolated staging preview
on:
  push:
    branches: [jgap-staging-workspace]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: jgap-staging-pages
  cancel-in-progress: true
jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify application before publishing
        run: node staging/verify.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload staging site
        uses: actions/upload-pages-artifact@v3
        with:
          path: staging
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
