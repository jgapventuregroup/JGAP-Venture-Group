name: Finalize known-good Deal Radar baseline
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-radar-baseline.yml'
permissions:
  contents: write
jobs:
  finalize:
    if: "!contains(github.event.head_commit.message, 'Finalize known-good Deal Radar baseline')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change only the Radar asset version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='./radar-filters.js?v=20261003-2'
          new='./radar-filters.js?v=20261004-baseline'
          if s.count(old)!=1:
              raise SystemExit(f'Expected exactly one old Radar reference; found {s.count(old)}')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Verify only the intended reference changed
        run: |
          grep -F './radar-filters.js?v=20261004-baseline' index.html
          test "$(grep -Fc './radar-filters.js?v=20261004-baseline' index.html)" -eq 1
          test "$(grep -Fc './radar-filters.js?v=20261003-2' index.html)" -eq 0
          git diff --check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Finalize known-good Deal Radar baseline'
          git push
