name: Ensure CELOC Deal Analyzer navigation
on:
  push:
    branches: [main]
    paths:
      - 'radar-filters.js'
      - '.github/workflows/ensure-celoc-navigation.yml'
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'Ensure CELOC navigation patch')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add persistent CELOC observer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('radar-filters.js')
          s=p.read_text(encoding='utf-8')
          if 'window.__jgapCelocNavigationObserver' in s:
              print('CELOC observer already present')
              raise SystemExit(0)
          needle="  var c=0,ct=setInterval(function(){if(document.getElementById('d_down')){initCeloc();if(++c>10)clearInterval(ct);}else if(++c>60)clearInterval(ct);},500);"
          if needle not in s:
              raise SystemExit('CELOC initializer marker not found; refusing unsafe edit')
          addition="""\n  window.__jgapCelocNavigationObserver=new MutationObserver(function(){\n    if(document.getElementById('d_down')){\n      addCelocUI();\n      addCelocLive();\n      wrapDealCalc();\n      window.calcDeal&&window.calcDeal();\n    }\n  });\n  if(document.body)window.__jgapCelocNavigationObserver.observe(document.body,{childList:true,subtree:true});\n"""
          s=s.replace(needle,needle+addition,1)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
      - name: Commit navigation fix
        run: |
          if git diff --quiet -- radar-filters.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radar-filters.js
          git commit -m 'Ensure CELOC navigation patch'
          git push