name: JGAP Deal Intelligence Tests
on:
  pull_request:
    paths:
      - 'deal-intelligence-adapter.js'
      - 'celoc-analyzer.js'
      - 'tests/**'
      - '.github/workflows/deal-intelligence-tests.yml'
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Deal Intelligence regression tests
        run: node --test tests/*.test.cjs
