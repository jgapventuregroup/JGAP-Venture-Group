name: Bump Deal Radar cache version
on:
  push:
    branches: [main]
    paths:
      - 'radar-filters.js'
      - '.github/workflows/radar-cache-bump.yml'
permissions:
  contents: write
jobs:
  bump:
    if: "!contains(github.event.head_commit.message, 'Bump Deal Radar cache version')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump only the Radar asset version
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          pattern = r'(\./radar-filters\.js\?v=)(\d{8})-(\d+)'
          m = re.search(pattern, s)
          if not m:
              raise SystemExit('Deal Radar asset reference was not found in index.html')
          old = m.group(0)
          version = int(m.group(3)) + 1
          new = f'{m.group(1)}{m.group(2)}-{version}'
          p.write_text(s[:m.start()] + new + s[m.end():], encoding='utf-8')
          print(f'Bumped {old} -> {new}')
          PY
          grep -oE './radar-filters.js\?v=[0-9]{8}-[0-9]+' index.html | head -1
          git diff --check
      - name: Commit cache bump
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Bump Deal Radar cache version'
          git push